<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="One B1 speaking question, three 90-second rounds. Students record, plan and reflect; the teacher collects transcripts and recordings in a room.">
<title>90-Second Speaking Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  /* Theme from the class slides: royal blue stage, cream cards, amber pill, navy ink */
  --blue:#3B44DB; --blue-2:#2E36C0; --blue-3:#5059E4;
  --cream:#FBF5EA; --cream-2:#F3EADA; --cream-3:#E5D9C2;
  --navy:#1F2560; --navy-2:#4A5088; --navy-3:#7D81AA;
  --amber:#F4B342; --coral:#EE6146; --pink:#F08BD0; --mint:#8ED8B4; --peri:#AEBBFF; --white:#FFFFFF;
  --ok:#17804F; --ok-bg:#D5F1E2; --bad:#B42E1C; --bad-bg:#FADBD3; --mid:#8A5A00; --mid-bg:#FCEAC2;
  --display:"Londrina Solid","Arial Narrow",Impact,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --r:22px;
  --acc:var(--amber);
  color-scheme:light;
}
[data-round="1"]{--acc:var(--amber)}
[data-round="2"]{--acc:var(--pink)}
[data-round="3"]{--acc:var(--coral)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--blue);color:var(--cream);font:400 16.5px/1.5 var(--body);overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:10px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--navy-3)}

/* decorations, like the slide corners */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute}
.d-squig{top:62px;left:-12px;width:118px}
.d-star{top:48px;right:-34px;width:150px;transform:rotate(12deg)}
.d-ast{bottom:-34px;left:-30px;width:160px}
.d-blob{bottom:-46px;right:-50px;width:180px}
.d-sp1{left:3%;top:52%;width:34px}
.d-sp2{right:3.5%;top:60%;width:30px}
@media (max-width:760px){.d-squig{width:70px;top:58px}.d-star{width:96px;right:-30px}.d-ast{width:100px}.d-blob{width:110px}.d-sp1,.d-sp2{display:none}}

/* app bar */
.bar{position:sticky;top:0;z-index:30;background:var(--blue);border-bottom:2px solid var(--blue-2)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none;flex:none}
.logo-mark{width:40px;height:40px;border-radius:50%;background:var(--amber);color:var(--navy);display:grid;place-items:center;font:900 20px var(--display);letter-spacing:.02em}
.logo-t{font:900 21px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.bar-mid{flex:1;display:flex;justify-content:center;min-width:0}
.bar-right{display:flex;gap:8px;align-items:center;flex:none}
.dots3{display:flex;align-items:center;gap:6px}
.dots3 span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 15px var(--display);border:2px solid rgba(251,245,234,.45);color:rgba(251,245,234,.75)}
.dots3 span.on{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.dots3 span.done{background:var(--cream);border-color:var(--cream);color:var(--navy)}
.dots3 i{width:14px;height:2px;background:rgba(251,245,234,.35)}
.rpill{display:inline-flex;align-items:center;gap:8px;background:var(--cream);color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.rpill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--navy-3)}
.rpill.ok::before{background:var(--ok)}
.rpill.warn::before{background:var(--amber)}
.rpill.err::before{background:var(--coral)}
@media (max-width:640px){.logo-t{display:none}.bar-in{gap:10px}.rpill{font-size:13px;padding:6px 11px}.dots3 span{width:26px;height:26px;font-size:13px}.dots3 i{width:8px}}

main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:22px 16px 90px;display:grid;gap:18px}
.narrow{max-width:860px;margin:0 auto;width:100%;display:grid;gap:18px}

/* headings on blue */
.kicker{color:var(--amber);font-weight:700;font-size:18px}
.display{font:900 clamp(38px,6.4vw,64px)/.98 var(--display);text-transform:uppercase;letter-spacing:.01em;color:var(--cream);text-wrap:balance}
.display.sm{font-size:clamp(30px,4.6vw,44px)}
.head{display:grid;gap:6px;justify-items:center;text-align:center;padding:4px 0}
.head.left{justify-items:start;text-align:left}
.sub{color:var(--cream);opacity:.9;font-size:18px;max-width:40em}

/* surfaces */
.card{background:var(--cream);color:var(--navy);border-radius:var(--r);padding:22px;display:grid;gap:14px;align-content:start}
.card h2{font:700 22px/1.2 var(--body);color:var(--blue)}
.card h3{font:700 18px/1.25 var(--body);color:var(--blue)}
.card p{color:var(--navy)}
.card .hint{color:var(--navy-2);font-size:15px}
.pillbox{background:var(--acc);color:var(--navy);border-radius:999px;padding:18px 30px;text-align:center;font:700 clamp(19px,2.8vw,28px)/1.25 var(--body);text-wrap:balance}
.qbox{background:var(--acc);color:var(--navy);border-radius:32px;padding:22px 28px;display:grid;gap:8px}
.qbox .ql{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.qbox .qt{font:700 clamp(21px,3.1vw,29px)/1.28 var(--body);text-wrap:balance}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;min-height:50px;font:700 17px/1.1 var(--body);background:var(--cream);color:var(--navy);cursor:pointer;text-decoration:none;text-align:center;transition:transform .12s,filter .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.blue{background:var(--blue);color:var(--white)}
.btn.navy{background:var(--navy);color:var(--cream)}
.btn.stop{background:var(--coral);color:var(--navy)}
.btn.line{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--cream-3)}
.btn.line:hover{box-shadow:inset 0 0 0 2px var(--navy-3)}
.on-blue .btn.line,.btn.line.inv{color:var(--cream);box-shadow:inset 0 0 0 2px rgba(251,245,234,.5)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:15px}
.btn.lg{min-height:58px;font-size:19px;padding:16px 30px}
.btn.xl{min-height:68px;font-size:21px;padding:18px 36px;min-width:min(320px,100%)}
.btn.full{width:100%}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--navy-2);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.on-blue .linkbtn{color:var(--cream)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions.end{justify-content:flex-end}
.actions.center{justify-content:center}
.err{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:10px 14px;font-weight:700}
.note{background:var(--cream-2);color:var(--navy-2);border-radius:14px;padding:12px 14px;font-size:15px}
.ok-note{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-weight:700;font-size:13.5px;background:var(--cream-2);color:var(--navy-2);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.mid{background:var(--mid-bg);color:var(--mid)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.blue{background:var(--blue);color:#fff}

/* inputs */
input[type=text],select,textarea{width:100%;border:2px solid var(--cream-3);background:var(--white);color:var(--navy);border-radius:14px;padding:12px 14px;font-size:17px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font:900 30px var(--display)!important;text-align:center}
.field{display:grid;gap:6px;font-weight:700;color:var(--navy)}
.field em{font-weight:400;font-style:normal;color:var(--navy-3)}
.switch{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:999px;background:var(--cream-3);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--white);transition:transform .2s}
.switch:checked{background:var(--blue)}
.switch:checked::after{transform:translateX(22px)}

/* landing */
.rounds3 .card{gap:8px}
.rounds3 .card .n{font:900 34px/1 var(--display);color:var(--acc)}
.rounds3 .card h3{color:var(--blue)}
.role{display:grid;gap:14px}
.role .card{gap:12px}
.join-row{display:flex;gap:10px}
.join-row input{flex:1;min-width:0}
.teacher-link{display:flex;justify-content:center}

/* question chooser */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:9px 15px;min-height:40px;font-weight:700;font-size:15px;background:var(--cream-2);color:var(--navy);cursor:pointer}
.chip:hover{background:var(--cream-3)}
.chip[aria-pressed=true]{background:var(--blue);color:#fff}
.qlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-height:440px;overflow:auto}
.qbtn{width:100%;height:100%;text-align:left;border:2px solid transparent;background:var(--white);border-radius:16px;padding:12px 14px;cursor:pointer;display:grid;gap:5px;align-content:start;color:var(--navy)}
.qbtn:hover{border-color:var(--cream-3)}
.qbtn .tp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.qbtn[aria-pressed=true]{background:var(--amber);border-color:var(--amber)}
.qbtn[aria-pressed=true] .tp{color:var(--navy)}
.startbar{position:sticky;bottom:12px;z-index:10;display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--navy);color:var(--cream);border-radius:24px;padding:12px 12px 12px 20px}
.startbar .t{min-width:0;display:grid;gap:2px}
.startbar .l{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.startbar .q{font-size:15.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:560px){.startbar{flex-direction:column;align-items:stretch;padding:14px}}

/* mic check */
.check-say{background:var(--cream-2);border-radius:18px;padding:16px 18px;font:700 21px/1.35 var(--body);color:var(--navy);text-align:center}
.lvl{height:16px;border-radius:999px;background:var(--cream-3);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .08s}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:flex;gap:12px;align-items:flex-start;background:var(--white);border-radius:16px;padding:12px 14px}
.checks .st{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:900}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.st.mid{background:var(--mid-bg);color:var(--mid)}
.checks b{display:block}
.checks span{color:var(--navy-2);font-size:15px}
.heard{font-style:italic}
.swc{grid-template-columns:auto 1fr auto;align-items:start;gap:14px;cursor:pointer}
.swc-ic{width:44px;height:44px;border-radius:50%;background:var(--cream-2);color:var(--blue);display:grid;place-items:center;font-size:20px}
.swc-b{display:grid;gap:6px}
.swc-b .note,.swc-b .err{font-size:14.5px}

/* rounds */
.instr{background:var(--cream);color:var(--navy);border-radius:var(--r);padding:16px 20px;font-size:18px;display:flex;gap:12px;align-items:flex-start}
.instr .ic{color:var(--blue);margin-top:4px;font-size:20px}
.partner{background:var(--pink);color:var(--navy);border-radius:var(--r);padding:14px 18px;display:flex;gap:12px;align-items:flex-start;font-weight:700}
.speak{justify-items:center;text-align:center;padding:28px 20px}
.ring-wrap{position:relative;width:min(260px,72vw);aspect-ratio:1}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:17}
.ring .tr{stroke:var(--cream-3)}
.ring .pr{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:603.19;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear,stroke .3s}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px}
.digits{font:900 clamp(60px,16vw,86px)/1 var(--display);color:var(--navy);display:flex}
.digits span{display:inline-block;width:.56em;text-align:center}
.digits span.c{width:.26em}
.ring-l{font-weight:700;color:var(--navy-2);font-size:15px;max-width:160px;line-height:1.25}
.speak.low .digits{color:var(--coral)}
.speak.low .ring .pr{stroke:var(--coral)}
.track{position:relative;width:min(520px,100%);height:12px;border-radius:999px;background:var(--cream-3);margin-bottom:12px}
.track i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:var(--blue);transition:width .12s linear}
.tick{position:absolute;top:16px;transform:translateX(-50%);font-size:12px;color:var(--navy-3)}
.tick::before{content:"";position:absolute;left:50%;top:-16px;width:3px;height:12px;background:var(--cream);transform:translateX(-50%)}
.statusrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.livepill{display:inline-flex;align-items:center;gap:7px;background:var(--cream-2);color:var(--navy-2);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px}
.livepill.rec{background:var(--bad-bg);color:var(--bad)}
.livepill.rec::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.45}}
.meter{display:flex;align-items:center;gap:4px;height:46px;opacity:.3;transition:opacity .3s}
.meter i{width:6px;height:6px;border-radius:4px;background:var(--blue);transition:height .08s}
.speak[data-state=live] .meter{opacity:1}
.speak[data-mode=transcript] .meter i{animation:wave 1s ease-in-out infinite}
.speak[data-mode=transcript]:not([data-state=live]) .meter i{animation:none}
.meter i:nth-child(3n){animation-delay:.15s}.meter i:nth-child(3n+1){animation-delay:.3s}
@keyframes wave{0%,100%{height:6px}50%{height:26px}}
.speak[data-mode=timer] .meter{display:none}
.speak-hint{color:var(--navy-2);font-size:15px;max-width:34em}
.mode-note{background:var(--amber);color:var(--navy);border-radius:var(--r);padding:14px 18px;font-weight:700}

/* result + reflection */
.result{border-top:10px solid var(--acc)}
.res-top{display:flex;gap:14px;align-items:flex-start}
.res-ic{width:50px;height:50px;border-radius:50%;background:var(--acc);color:var(--navy);display:grid;place-items:center;font-size:24px;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0}
.stats div{background:var(--cream-2);border-radius:16px;padding:10px 14px;min-width:120px}
.stats dt{font-size:12.5px;font-weight:700;color:var(--navy-2)}
.stats dd{margin:2px 0 0;font:900 30px/1 var(--display);color:var(--navy)}
.stats small{font:700 12px var(--body);color:var(--navy-3)}
.player{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.player audio{flex:1 1 240px;min-width:0;height:44px}
.tri-list{display:grid;gap:10px}
.tri{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--white);border-radius:16px;padding:10px 12px 10px 16px;border:2px solid transparent}
.tri.missing,.flu.missing{border-color:var(--coral)}
.tri-l{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1 1 260px}
.opts{display:flex;gap:6px}
.opt{border:0;border-radius:999px;padding:9px 16px;min-height:42px;font-weight:700;font-size:15px;background:var(--cream-2);color:var(--navy);cursor:pointer}
.opt:hover{background:var(--cream-3)}
.opt[aria-checked=true][data-v="2"]{background:var(--blue);color:#fff}
.opt[aria-checked=true][data-v="1"]{background:var(--amber)}
.opt[aria-checked=true][data-v="0"]{background:var(--navy);color:var(--cream)}
.flu{background:var(--white);border-radius:16px;padding:14px 16px;display:grid;gap:10px;border:2px solid transparent}
.flu-o{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fo{border:0;border-radius:14px;padding:8px 4px;background:var(--cream-2);cursor:pointer;display:grid;gap:2px;justify-items:center;min-height:64px;color:var(--navy)}
.fo b{font:900 24px/1 var(--display)}
.fo span{font-size:12px;line-height:1.2;text-align:center;color:var(--navy-2)}
.fo[aria-checked=true]{background:var(--blue);color:#fff}
.fo[aria-checked=true] span{color:#fff}
.mchip{border:0;border-radius:999px;padding:9px 15px;min-height:40px;font-weight:700;font-size:15px;background:var(--white);color:var(--navy);cursor:pointer}
.mchip[aria-pressed=true]{background:var(--blue);color:#fff}

/* moves + planning */
.moves{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:640px){.moves{grid-template-columns:1fr}}
.move{background:var(--cream);color:var(--navy);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.move .mn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:900 24px var(--display);flex:none;color:var(--navy)}
.move h3{font:900 24px/1 var(--display);letter-spacing:.04em;color:var(--blue)}
.move p{color:var(--navy);margin-top:4px}
.mt{display:inline-block;font:700 11.5px/1 var(--body);letter-spacing:.1em;padding:6px 9px;border-radius:999px;color:var(--navy)}
[data-move=answer] .mn,.mt[data-move=answer],.sig-opinion{background:var(--amber)}
[data-move=explain] .mn,.mt[data-move=explain],.sig-reason{background:var(--pink)}
[data-move=exemplify] .mn,.mt[data-move=exemplify],.sig-example{background:var(--mint)}
[data-move=extend] .mn,.mt[data-move=extend],.sig-extend{background:var(--peri)}
details.starters{background:var(--cream);color:var(--navy);border-radius:var(--r);padding:4px 20px}
details.starters summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;gap:10px;align-items:center;color:var(--blue)}
details.starters summary::-webkit-details-marker{display:none}
details.starters summary::before{content:"+";width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900}
details.starters[open] summary::before{content:"\2013"}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:2px 0 18px}
@media (max-width:760px){.sgrid{grid-template-columns:repeat(2,1fr)}}
.sgrid ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.sgrid li{background:var(--white);border-radius:12px;padding:7px 11px;font-size:15px}
.callout{background:var(--amber);color:var(--navy);border-radius:var(--r);padding:16px 20px;display:grid;gap:6px}
.callout ul{margin:0;padding-left:20px;display:grid;gap:4px}
.planbar{position:sticky;top:76px;z-index:5;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.planbar .grow{flex:1 1 200px}
.mring{position:relative;width:70px;height:70px;flex:none}

/* Loudness-based estimate of talking time and long pauses (adaptive threshold). */
function analyzeLevels(rms, durationSec){
  if (!rms || !rms.length) return {reliable:false, peak:0};
  let peak0 = 0; for (const v of rms) if (v > peak0) peak0 = v;
  if (rms.length < 40 || !durationSec) return {reliable:false, peak:peak0};
  const F = (durationSec*1000)/rms.length;
  const sorted = [...rms].sort((a,b)=>a-b), q = p => sorted[Math.floor(p*(sorted.length-1))];
  const noise = q(0.10), peak = q(0.95);
  if (peak < 0.006 || peak < noise*2.5) return {reliable:false, peak:peak0};
  const thr = Math.max(noise*2, noise + (peak-noise)*0.15), s = rms.map(v => v > thr);
  const gap = Math.max(1, Math.round(300/F)), blip = Math.max(1, Math.round(150/F));
  let i = 0;
  while (i < s.length){ if (!s[i]){ let j=i; while (j<s.length && !s[j]) j++; if (i>0 && j<s.length && (j-i)<gap) for (let k=i;k<j;k++) s[k]=true; i=j; } else i++; }
  i = 0;
  while (i < s.length){ if (s[i]){ let j=i; while (j<s.length && s[j]) j++; if ((j-i)<blip) for (let k=i;k<j;k++) s[k]=false; i=j; } else i++; }
  const first = s.indexOf(true), last = s.lastIndexOf(true);
  if (first < 0) return {reliable:false, peak:peak0};
  let talk=0, pauses=0, longest=0; i = first;
  while (i <= last){ if (s[i]){ talk++; i++; } else { let j=i; while (j<=last && !s[j]) j++; const len=(j-i)*F; if (len>=1000){ pauses++; longest=Math.max(longest,len); } i=j; } }
  return {reliable:true, peak:peak0, startDelay:first*F/1000, talk:talk*F/1000, pauses, longest:longest/1000};
}

class WebSpeechEngine {
  constructor(){ this.text=''; this.interim=''; this.on=false; this.error=null; this.rec=null; this.done=null; this.onUpdate=null; this.results=0; }
  start(){ this.on = true; this.spawn(); }
  spawn(){
    let r; try { r = new ENV.SR(); } catch(e){ this.error = 'unsupported'; this.on = false; return; }
    r.lang = 'en-US'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = e => {
      let interim = '';
      for (let i=e.resultIndex; i<e.results.length; i++){ const res = e.results[i], t = res[0].transcript; if (res.isFinal){ this.text += (this.text?' ':'') + t.trim(); this.results++; } else interim += t; }
      this.interim = interim; if (this.onUpdate) this.onUpdate();
    };
    r.onerror = e => { if (['not-allowed','service-not-allowed','audio-capture','language-not-supported'].includes(e.error)){ this.error = e.error; this.on = false; } else if (e.error === 'network'){ this.error = 'network'; } };
    r.onend = () => { if (this.on) setTimeout(() => { if (this.on) this.spawn(); }, 120); else if (this.done) this.done(); };
    this.rec = r;
    try { r.start(); } catch(e){ this.error = 'start'; this.on = false; }
  }
  stop(){
    return new Promise(resolve => {
      let to = 0, fired = false;
      const finish = () => { if (fired) return; fired = true; clearTimeout(to); if (this.interim){ this.text += (this.text?' ':'') + this.interim.trim(); this.interim=''; } resolve(this.text.trim()); };
      this.on = false; this.done = finish; to = setTimeout(finish, 2200);
      if (!this.rec){ finish(); return; }
      try { this.rec.stop(); } catch(e){ finish(); }
    });
  }
  cancel(){ this.on = false; try { this.rec && this.rec.abort(); } catch(e){} }
  live(){ return (this.text + ' ' + this.interim).trim(); }
}

const SIGNALS = {

const SIG_LIST = Object.entries(SIGNALS).flatMap(([g,a]) => a.map(p => ({p,g}))).sort((a,b) => b.p.length - a.p.length);
const SIG_MAP = new Map(SIG_LIST.map(x => [x.p, x.g]));
const SIG_RE = new RegExp('\\b(' + SIG_LIST.map(x => x.p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s+').replace(/'/g,"['\u2019]")).join('|') + ')\\b', 'gi');
const normSig = m => m.toLowerCase().replace(/\s+/g,' ').replace(/\u2019/g,"'");
const STOP = new Set(("a an the and or but so if of to in on at for with from by as is are was were be been being am i me my mine you your yours he him his she her it its we us our they them their this that these those there here what which who whom when where why how not no yes do does did done have has had will would can could should may might must just very really also too than then about into over under up down out more most some any all each every much many such own same other only i'm it's that's there's they're we're you're don't doesn't didn't can't won't isn't aren't wasn't lot lots thing things think because example people get got go going like want know yeah okay ok well").split(' '));
const tokens = t => (String(t).toLowerCase().replace(/\u2019/g,"'").match(/[a-z']+/g) || []);
const contentWords = t => tokens(t).filter(w => w.length > 2 && !STOP.has(w));
function textStats(text, duration){
  if (!text) return null;
  const tk = tokens(text), sig = {opinion:0, reason:0, example:0, extend:0};
  (text.match(SIG_RE) || []).forEach(m => { const g = SIG_MAP.get(normSig(m)); if (g) sig[g]++; });
  const tri = new Map(); for (let i=0; i+3<=tk.length; i++){ const g = tk.slice(i,i+3).join(' '); tri.set(g, (tri.get(g)||0)+1); }
  return {words:tk.length, wpm: duration >= 10 ? Math.round(tk.length/(duration/60)) : null, sig, repeated:[...tri].filter(([,c]) => c >= 2).sort((a,b) => b[1]-a[1]), content:new Set(contentWords(text))};
}

class Countdown {
  constructor(total, onTick, onDone){ this.total=total; this.onTick=onTick; this.onDone=onDone; this.iv=0; this.t0=0; this.stopped=false; }
  start(){ this.t0 = performance.now(); this.iv = setInterval(() => this.tick(), 100); this.tick(); }
  elapsed(){ return (performance.now() - this.t0)/1000; }
  tick(){ if (this.stopped) return; const el = this.elapsed(), left = Math.max(0, this.total - el); this.onTick(left, el); if (left <= 0){ this.stop(); this.onDone(); } }
  stop(){ this.stopped = true; clearInterval(this.iv); }
}

function p2pStudent(code, h){
  let peer = null, conn = null, latest = null, timer = null;

    kind:'p2p', code,
    send(st){ latest = st; safeSend(conn, {t:'st', s:st}); },
    sendAudio(m){ pending.set(m.aid + '|' + m.r, m); safeSend(conn, m); },
    pendingCount(){ return pending.size; },
    start,
  };

    h.status('warn', 'Connecting\u2026');

    peer.on('error', e => { if (e.type === 'peer-unavailable'){ h.status('err', 'Teacher\u2019s room is closed'); later(4000); } else { h.status('warn', 'Connecting\u2026'); later(3000); } });

  }

    if (!peer || peer.disconnected || (conn && conn.open)){ if (peer && peer.disconnected) later(2000); return; }

    c.on('open', () => { h.status('ok', 'Connected'); if (latest) safeSend(c, {t:'st', s:latest}); pending.forEach(m => safeSend(c, m)); });
    c.on('data', m => {
      if (!m || typeof m !== 'object') return;
      if (m.t === 'cfg') h.cfg(m.d);
      else if (m.t === 'sack') h.sack(m.ts);
      else if (m.t === 'ack'){ const k = m.aid + '|' + m.r, p = pending.get(k); if (p && p.v === m.v) pending.delete(k); h.ack(); }
    });

    c.on('error', () => {});
  }

}
function localHost(code, h){
  const bc = new BroadcastChannel('spk90-' + code); let cfg = null; const seen = new Map();
  bc.onmessage = e => {
    const m = e.data; if (!m || m.to !== 'host') return;
    const first = m.aid && !seen.has(m.aid); if (m.aid) seen.set(m.aid, Date.now());
    if (first) bc.postMessage({to:m.aid, t:'cfg', d:cfg});
    if (m.t === 'st'){ h.state(m.s); bc.postMessage({to:m.s.aid, t:'sack', ts:m.s.ts}); }
    if (m.t === 'au'){ h.audio(m); bc.postMessage({to:m.aid, t:'ack', aid:m.aid, r:m.r, v:m.v}); }
    h.conns();
  };
  setInterval(() => h.conns(), 5000);
  return {kind:'local', code,
    setCfg(c){ cfg = c; bc.postMessage({to:'all', t:'cfg', d:cfg}); },
    onlineAids(){ const s = new Set(), now = Date.now(); seen.forEach((t, a) => { if (now - t < 25000) s.add(a); }); return s; },
    open(){ h.status('ok', 'Local test room'); }, destroy(){ bc.close(); }};
}
function localStudent(code, h){
  const bc = new BroadcastChannel('spk90-' + code); let latest = null; const pending = new Map();

    const m = e.data; if (!m || (m.to !== 'all' && m.to !== (latest && latest.aid))) return;

    if (m.t === 'sack') h.sack(m.ts);

  };
  return {kind:'local', code,
    send(st){ latest = st; bc.postMessage({to:'host', t:'st', aid:st.aid, s:st}); },
    sendAudio(m){ pending.set(m.aid + '|' + m.r, m); bc.postMessage(Object.assign({to:'host'}, m)); },
    pendingCount(){ return pending.size; },
    start(){ h.status('ok', 'Connected (local test)'); setInterval(() => { if (latest) bc.postMessage({to:'host', t:'hb', aid:latest.aid}); }, 8000); }};
}

function micHelp(err){

  if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') return {title:'No microphone found', body:'Connect a microphone or a headset with a microphone, then try again.'};
  if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError' || n === 'audio-capture') return {title:'The microphone is busy', body:'Another app or browser tab is using the microphone. Close it, then try again.'};

}

function confetti(){
  if (ENV.reduced) return;
  const c = $('#confetti'); c.hidden = false; const ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#F4B342','#EE6146','#F08BD0','#FBF5EA','#8ED8B4'];
  const P = Array.from({length:150}, () => ({x:innerWidth/2 + (Math.random()-0.5)*innerWidth*0.4, y:innerHeight*0.35, vx:(Math.random()-0.5)*11, vy:-Math.random()*12-4, r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3, w:6+Math.random()*6, h:8+Math.random()*8, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  const step = t => { ctx.clearRect(0,0,innerWidth,innerHeight); P.forEach(p => { p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if (t - t0 < 3200) requestAnimationFrame(step); else { ctx.clearRect(0,0,innerWidth,innerHeight); c.hidden = true; } };

      <ul class="qlist">${list.map(q => `<li><button class="qbtn" data-a="pick" data-id="${q.id}" aria-pressed="${q.id === S.selectedId}">${S.topic === 'all' ? `<span class="tp">${q.topicName}</span>` : ''}<span>${esc(q.text)}</span></button></li>`).join('')}</ul>
      <div style="border-top:2px solid var(--cream-2);padding-top:14px">${devLine()}</div>
      <label class="actions" for="pairT" style="justify-content:space-between;cursor:pointer;border-top:2px solid var(--cream-2);padding-top:14px"><span><b>Practising with a partner?</b><br><span class="hint">Your partner listens, then you check together.</span></span><input type="checkbox" class="switch" id="pairT" data-a="pair" ${S.pair ? 'checked' : ''}></label>
    </div>
    <div class="startbar" id="startbar"><div class="t"><span class="l">${sel ? 'Your question for all 3 rounds' : 'No question yet'}</span><span class="q" id="sbQ">${sel ? esc(sel.text) : 'Pick a question, or get a random one.'}</span></div><button class="btn amber lg" data-a="begin" ${sel ? '' : 'disabled'}>Start Round 1 ${ICON.arrow}</button></div>`;
}

function devLine(){
  const on = S.wantTr && !!ENV.SR;
  return `<div class="actions" style="justify-content:space-between"><span><b>This device: ${MODE_TEXT[S.mode]}</b><br><span class="hint">Automatic transcript is ${on ? 'on' : 'off'}.</span></span><button class="btn line sm" data-a="to-check">Change</button></div>`;
}
function questionBox(n){ return `<div class="qbox"><span class="ql">${ICON.lock} ${n === 1 ? 'Your question' : 'Same question as Round 1'}</span><span class="qt">${esc(S.question.text)}</span></div>`; }
function roundHead(n){ return `<div class="head"><p class="kicker">Round ${n} of 3</p><h1 class="display">${ROUNDS[n-1].name}</h1></div>`; }
const partnerCard = n => S.pair ? `<div class="partner">${ICON.users}<p>${PARTNER[n-1]}</p></div>` : '';
const instr = t => `<div class="instr">${ICON.info}<p>${t}</p></div>`;
function modeNote(){
  if (!S.modeNote) return '';
  const t = S.modeNote === 'transcript' ? 'Your phone couldn\u2019t record and make a transcript at the same time, so from the next round recording is off and the transcript stays on.' : 'The transcript isn\u2019t working on this device. From the next round we only record your voice.';
  return `<div class="mode-note">${t}</div>`;
}
function speakWidget(n){
  const mode = S.mode;
  const pill = mode === 'both' ? ICON.mic + ' Recording + transcript' : mode === 'record' ? ICON.mic + ' Recording' : mode === 'transcript' ? ICON.text + ' Transcript' : ICON.timer + ' Timer only';
  return `<div class="card speak" id="speak" data-state="idle" data-mode="${mode}">
    <div class="ring-wrap"><svg class="ring" viewBox="0 0 220 220" aria-hidden="true"><circle class="tr" cx="110" cy="110" r="96"/><circle class="pr" id="ringP" cx="110" cy="110" r="96"/></svg>
      <div class="ring-c"><div class="digits" id="digits" role="timer" aria-label="Time left">${digitsHTML('1:30')}</div><div class="ring-l" id="ringL">90 seconds</div></div></div>
    <div class="track" aria-hidden="true"><i id="trackF"></i><span class="tick" style="left:33.333%">30 s</span><span class="tick" style="left:66.666%">60 s</span></div>
    <div class="statusrow"><span class="livepill" id="recPill">${pill}</span></div>
    <div class="meter" id="meter" aria-hidden="true">${'<i></i>'.repeat(28)}</div>
    <div class="actions center">
      <button class="btn blue xl" id="startBtn" data-a="speak-start" data-round="${n}">${ICON.mic} Start speaking</button>
      <button class="btn stop xl" id="stopBtn" data-a="speak-stop" hidden>${ICON.stop} I\u2019ve finished</button>
    </div>
    <p class="speak-hint" id="speakHint">After a 3-second countdown the timer starts. Speak until it reaches 0:00, or tap \u201cI\u2019ve finished\u201d.</p>
  </div>`;
}
function feedbackFor(n){
  const R = S.rounds[n-1], t = Math.round(R.duration);
  if (n === 1){
    if (t >= 80) return ['Great start!', `You kept talking for ${t} seconds. In Round 2 you will make those ideas richer.`];
    if (t >= 45) return ['Round 1 done!', `You spoke for ${t} seconds. Next, you will plan more ideas so you can use the full 90 seconds.`];
    return ['First try finished!', `You spoke for ${t} seconds. That is normal for a first try. Round 2 gives you tools to say more.`];
  }
  const d = t - Math.round(S.rounds[n-2].duration);
  const dt = d > 0 ? `${d} seconds more than Round ${n-1}` : d < 0 ? `${-d} seconds less than Round ${n-1}` : `the same as Round ${n-1}`;
  return n === 2 ? ['Answer developed!', `You spoke for ${t} seconds (${dt}). Did you add new ideas, or only more words?`] : ['Final round done!', `You spoke for ${t} seconds (${dt}). Do the last self-check, then compare your rounds.`];
}
function resultCard(n){
  const R = S.rounds[n-1], [title, msg] = feedbackFor(n), a = R.analysis, words = wordCount(R.transcript);
  return `<div class="card result">
    <div class="res-top"><div class="res-ic">${ICON.check}</div><div><h2>${title}</h2><p>${msg}</p></div></div>
    <dl class="stats">
      <div><dt>Speaking time</dt><dd>${Math.round(R.duration)} s</dd></div>
      ${a && a.reliable ? `<div><dt>Long pauses (1 s+)</dt><dd>${a.pauses} <small>estimate</small></dd></div>` : ''}
      ${R.trTried ? `<div><dt>Words in transcript</dt><dd>${words}</dd></div>` : ''}
    </dl>
    ${R.url ? `<div class="player"><audio controls preload="metadata" src="${R.url}"></audio><a class="btn line sm" href="${R.url}" download="round${n}-speaking.${extFor(R.mime)}">${ICON.download} Download</a></div>` : ''}
    ${R.trTried && !words ? `<p class="note">No transcript this time${R.trError ? ` (${esc(TR_ERR[R.trError] || R.trError)})` : ''}.</p>` : ''}
    <div><button class="linkbtn" data-a="redo" data-round="${n}">${ICON.redo} Redo this round</button></div>
  </div>`;
}
function triItem(n, key, label, val){
  return `<div class="tri" data-key="${key}"><span class="tri-l">${label}</span><div class="opts" role="radiogroup" aria-label="${esc(label.replace(/<[^>]+>/g,''))}">${[['2','Yes'],['1','A little'],['0','No']].map(([v,t]) => `<button type="button" class="opt" role="radio" aria-checked="${String(val) === v}" data-a="tri" data-round="${n}" data-key="${key}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
}
function reflectForm(n){
  const f = S.rounds[n-1].self;
  return `<form class="card" id="reflect" novalidate>
    <h2>${S.pair ? 'Check together' : 'Self-check'}</h2>
    <p class="hint">${S.pair ? 'Answer together with your partner. Be honest: this is for your own progress.' : 'Listen to your recording if you like, then answer honestly.'}</p>
    <div class="tri-list">${MOVES.map(m => triItem(n, m.key, (n > 1 ? `<span class="mt" data-move="${m.id}">${m.name}</span>` : '') + CHECK_Q[m.key], f[m.key])).join('')}${n === 3 ? triItem(3, 'complete', 'Did I use complete sentences?', f.complete) : ''}</div>
    <div class="flu" data-key="fluency"><b>How smoothly did I speak?</b><div class="flu-o" role="radiogroup" aria-label="How smoothly did I speak?">${FLUENCY.map((t,i) => `<button type="button" class="fo" role="radio" aria-checked="${f.fluency === i+1}" data-a="flu" data-round="${n}" data-v="${i+1}"><b>${i+1}</b><span>${t}</span></button>`).join('')}</div></div>
    ${n === 1 ? `<div class="field"><span>Where did I get stuck? <em>(choose any)</em></span><div class="chips">${Object.entries(STUCK).map(([k,v]) => `<button type="button" class="mchip" aria-pressed="${f.stuck.includes(k)}" data-a="stuck" data-v="${k}">${v.label}</button>`).join('')}</div></div>
      <label class="field" for="stuckNote"><span>Anything else? <em>(optional)</em></span><input type="text" id="stuckNote" data-field="stuckNote" maxlength="160" value="${esc(f.stuckNote)}" placeholder="e.g. I didn\u2019t know the word for\u2026"></label>` : ''}
    ${n === 2 ? `<label class="field" for="newIdea"><span>What new idea or detail did I add this time? <em>(optional)</em></span><textarea id="newIdea" data-field="newIdea" rows="2" maxlength="300">${esc(f.newIdea)}</textarea></label>` : ''}
    <p class="err" id="formErr" hidden></p>
    <div class="actions end"><button type="button" class="btn blue lg" data-a="next" data-round="${n}">${n === 1 ? 'Continue to Round 2' : n === 2 ? 'Continue to Round 3' : 'See my results'} ${ICON.arrow}</button></div>
  </form>`;
}
function startersHTML(){ return `<details class="starters"><summary>Sentence starters (optional)</summary><div class="sgrid">${MOVES.map(m => `<div><span class="mt" data-move="${m.id}">${m.name}</span><ul>${m.starters.map(s => `<li>${s}</li>`).join('')}</ul></div>`).join('')}</div></details>`; }
function renderRound(n){
  const ph = S.phase[n]; let body = '';
  if (n === 1) body = ph === 'speak' ? instr(ROUNDS[0].instr) + partnerCard(1) + speakWidget(1) : resultCard(1) + feedbackCard(1) + reflectForm(1);
  if (n === 2) body = ph === 'learn' ? r2Learn() : ph === 'plan' ? r2Plan() : ph === 'speak' ? r2Speak() : resultCard(2) + feedbackCard(2) + reflectForm(2);
  if (n === 3) body = ph === 'pick' ? r3Pick() : ph === 'speak' ? r3Speak() : resultCard(3) + feedbackCard(3) + reflectForm(3);
  return `<div class="narrow" data-round="${n}">${roundHead(n)}${questionBox(n)}${modeNote()}${body}</div>`;
}
function r2Learn(){
  const stuck = S.rounds[0].self.stuck.filter(s => s !== 'none');
  return instr(ROUNDS[1].instr)
    + (stuck.length ? `<div class="callout"><b>In Round 1 you got stuck with:</b><ul>${stuck.map(s => `<li>${STUCK[s].label}. ${STUCK[s].tip}</li>`).join('')}</ul></div>` : '')
    + `<div class="head left"><h2 class="display sm">Four speaking moves</h2></div>
    <ol class="moves">${MOVES.map((m,i) => `<li class="move" data-move="${m.id}"><span class="mn">${i+1}</span><div><h3>${m.name}</h3><p>${m.desc}</p></div></li>`).join('')}</ol>
    ${startersHTML()}
    <div class="card"><div class="actions" style="justify-content:space-between"><div><h3>Next: 30 seconds to plan</h3><p class="hint">Write keywords only (1\u20133 words), not sentences.</p></div><button class="btn blue lg" data-a="plan-start">${ICON.timer} Start planning</button></div></div>`;
}
const kwHTML = (m, t, i, lock) => `<li class="kw ${lock ? 'lock' : ''}">${esc(t)}${lock ? '' : `<button type="button" data-a="kw-del" data-move="${m}" data-i="${i}" aria-label="Remove ${esc(t)}">\u00d7</button>`}</li>`;
const kwsHTML = (m, lock) => S.plan[m].length ? S.plan[m].map((t,i) => kwHTML(m, t, i, lock)).join('') : `<li class="empty">${lock ? 'No keywords' : 'No keywords yet'}</li>`;
function r2Plan(){
  const lock = S.planLocked;
  return (lock ? `<div class="timeup"><span>${ICON.check} Planning time is over. Your keywords are saved.</span><button class="btn blue" data-a="plan-go">Go to speaking ${ICON.arrow}</button></div>`
      : `<div class="card planbar"><div class="mring" id="mRing"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="tr" cx="32" cy="32" r="26"/><circle class="pr" id="mProg" cx="32" cy="32" r="26"/></svg><b id="mSec">30</b></div><div class="grow"><h3>Plan with keywords</h3><p class="hint">1\u20133 words each. Press Enter to add.</p></div><button class="btn blue" data-a="plan-done">I\u2019m ready to speak</button></div>`)
    + `<div class="pgrid">${MOVES.map(m => `<div class="card pbox" data-move="${m.id}"><div class="pbox-h"><span class="mt" data-move="${m.id}">${m.name}</span><span>${m.hint}</span></div><ul class="kws" id="kws-${m.id}">${kwsHTML(m.id, lock)}</ul>${lock ? '' : `<div class="addrow"><input type="text" id="in-${m.id}" data-move="${m.id}" maxlength="32" placeholder="Add a keyword" autocomplete="off" enterkeyhint="done" aria-label="Keyword for ${m.name}"><button type="button" class="btn blue sm" data-a="kw-add" data-move="${m.id}">Add</button></div>`}</div>`).join('')}</div>
    <p class="err" id="planErr" hidden></p>`;
}
function r2Speak(){
  return instr('Use the four moves. Add relevant, specific ideas. Look at your keywords only when you need them.')
    + `<div class="notes">${MOVES.map(m => `<div class="note-c"><span class="mt" data-move="${m.id}">${m.name}</span><div class="nk">${S.plan[m.id].length ? S.plan[m.id].map(t => `<span>${esc(t)}</span>`).join('') : '<span class="muted">\u2013</span>'}</div></div>`).join('')}</div>`
    + startersHTML() + partnerCard(2) + speakWidget(2);
}
function poolKeywords(){
  const out = [], seen = new Set();
  MOVES.forEach(m => S.plan[m.id].forEach(t => { const k = t.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push({text:t, move:m.name}); } }));
  S.extraKw.forEach(t => { const k = t.toLowerCase(); if (!seen.has(k)){ seen.add(k); out.push({text:t, move:'NEW'}); } });
  return out;
}
function r3Pick(){
  const pool = poolKeywords(), sel = S.r3Keywords, ok = sel.length >= 3 && sel.length <= 5;
  return instr('Choose <b>3 to 5 keywords</b> from your plan. They will be the only notes you see while you speak. No script!')
    + `<div class="card">
      <div class="pool">${pool.length ? pool.map(k => `<button type="button" class="pk" data-a="pk" data-kw="${esc(k.text)}" aria-pressed="${sel.includes(k.text)}"><small>${k.move}</small>${esc(k.text)}</button>`).join('') : '<p class="hint">You don\u2019t have planning keywords. Add some below.</p>'}</div>
      <div class="addrow" style="max-width:440px"><input type="text" id="kwNew" maxlength="32" placeholder="Add another keyword (1\u20133 words)" autocomplete="off" aria-label="Add another keyword"><button type="button" class="btn blue sm" data-a="kw-extra">Add</button></div>
      <p class="err" id="kwErr" hidden></p>
      <div class="pickfoot"><span class="count ${ok ? 'ok' : ''}" id="kwCount">${sel.length} / 5 selected</span><button class="btn blue lg" id="kwGo" data-a="kw-lock" ${ok ? '' : 'disabled'}>Use these keywords ${ICON.arrow}</button></div>
    </div>`;
}
function r3Speak(){
  return instr(ROUNDS[2].instr + ' Use complete sentences, and keep going instead of stopping for long pauses.')
    + `<div class="bigkw" aria-label="Your keywords">${S.r3Keywords.map(k => `<span>${esc(k)}</span>`).join('')}</div>` + partnerCard(3) + speakWidget(3);
}

/* ---------- results ---------- */
const devScore = f => MOVES.reduce((s,m) => s + (f[m.key] === 2 ? 1 : f[m.key] === 1 ? 0.5 : 0), 0);
const ynTag = v => v === 2 ? '<span class="tag ok">Yes</span>' : v === 1 ? '<span class="tag mid">A little</span>' : v === 0 ? '<span class="tag bad">No</span>' : '<span class="muted">\u2013</span>';
const devTag = sc => sc >= 3.5 ? '<span class="tag ok">Yes</span>' : sc >= 2 ? '<span class="tag mid">Partly</span>' : '<span class="tag bad">Not yet</span>';
const dotsHTML = sc => `<span class="dots" aria-hidden="true">${[1,2,3,4].map(i => `<i class="${sc >= i ? 'full' : sc >= i-0.5 ? 'half' : ''}"></i>`).join('')}</span>`;
const segsHTML = v => `<span class="segs" aria-hidden="true">${[1,2,3,4,5].map(i => `<i class="${v >= i ? 'on' : ''}"></i>`).join('')}</span>`;
function renderResults(){
  const R = S.rounds, stats = R.map(r => r.transcript ? textStats(r.transcript, r.duration) : null);
  const anyTr = stats.some(Boolean), anyAudio = R.some(r => r.analysis && r.analysis.reliable), anyRec = R.some(r => r.url);
  const r1c = stats[0] ? stats[0].content : null;
  const newWords = stats.map((s,i) => (i === 0 || !s || !r1c) ? null : [...s.content].filter(w => !r1c.has(w)));
  const cards = R.map((r,i) => { const sc = devScore(r.self); return `<div class="card rc" data-round="${i+1}">
      <div class="rc-h"><span class="n">${i+1}</span><b>${ROUNDS[i].name}</b></div>
      <div class="metric"><div class="metric-t"><span class="metric-n">Speaking time</span><span class="metric-v">${Math.round(r.duration)}<small> / 90 s</small></span></div><div class="bar2"><i style="--w:${Math.min(100, r.duration/90*100).toFixed(1)}%"></i></div></div>
      <div class="metric"><div class="metric-t"><span class="metric-n">Idea development (self-check)</span><span class="metric-v">${sc}<small> / 4</small></span></div>${dotsHTML(sc)}</div>
      <div class="metric"><div class="metric-t"><span class="metric-n">Fluency (self-rating)</span><span class="metric-v">${r.self.fluency ?? '\u2013'}<small> / 5</small></span></div>${segsHTML(r.self.fluency || 0)}</div></div>`; }).join('');
  const facts = [], t1 = Math.round(R[0].duration), t3 = Math.round(R[2].duration);
  facts.push(t3 > t1 ? `Your speaking time went up from ${t1} to ${t3} seconds.` : t3 < t1 ? `Your speaking time went from ${t1} to ${t3} seconds. Check if Round 3 still had all your ideas.` : `You spoke for ${t1} seconds in both Round 1 and Round 3.`);
  facts.push(`Your idea development self-check went from ${devScore(R[0].self)}/4 in Round 1 to ${devScore(R[2].self)}/4 in Round 3.`);
  if (R[0].self.fluency && R[2].self.fluency) facts.push(`You rated your fluency ${R[0].self.fluency}/5 in Round 1 and ${R[2].self.fluency}/5 in Round 3.`);
  if (R[0].analysis?.reliable && R[2].analysis?.reliable) facts.push(`Estimated long pauses (1 second or more): ${R[0].analysis.pauses} in Round 1, ${R[2].analysis.pauses} in Round 3.`);
  if (stats[0] && stats[2]){ const s1 = stats[0].sig.reason + stats[0].sig.example + stats[0].sig.extend, s3 = stats[2].sig.reason + stats[2].sig.example + stats[2].sig.extend; facts.push(`In your transcripts you used ${s3} reason, example and extra-detail signal words in Round 3 (Round 1: ${s1}).`); if (newWords[2]) facts.push(`Round 3 had ${newWords[2].length} content words that were not in Round 1.`); }
  const row = (l, cells, sub) => `<tr><th scope="row">${l}${sub ? `<small>${sub}</small>` : ''}</th>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
  const group = l => `<tr class="g"><th colspan="4">${l}</th></tr>`;
  let rows = group('Measured') + row('Speaking time', R.map(r => `${Math.round(r.duration)} s`), 'from the timer');
  if (anyAudio){ const A = f => R.map(r => r.analysis && r.analysis.reliable ? f(r.analysis) : '<span class="muted">\u2013</span>');
    rows += row('Time before the first word', A(a => `${a.startDelay.toFixed(1)} s`), 'estimate from sound level') + row('Long pauses (1 s or more)', A(a => a.pauses), 'estimate from sound level') + row('Talking time without long pauses', A(a => `${Math.round(a.talk)} s`), 'estimate from sound level'); }
  rows += group('Your self-check') + row('Answered the question', R.map(r => ynTag(r.self.answered))) + row('Gave reasons', R.map(r => ynTag(r.self.reasons))) + row('Gave a specific example', R.map(r => ynTag(r.self.example))) + row('Added extra details', R.map(r => ynTag(r.self.extra)))
    + row('Answer developed enough', R.map(r => devTag(devScore(r.self))), 'based on the four checks') + row('Fluency', R.map(r => r.self.fluency ? `${r.self.fluency}/5 \u00b7 ${FLUENCY[r.self.fluency-1]}` : '\u2013'), 'your rating')
    + row('Complete sentences', ['<span class="muted">not asked</span>', '<span class="muted">not asked</span>', ynTag(R[2].self.complete)]);
  if (anyTr){ const Tc = f => stats.map((s,i) => s ? f(s,i) : `<span class="muted">${R[i].trTried ? 'no words' : '\u2013'}</span>`);
    rows += group('From the automatic transcript') + row('Words', Tc(s => s.words)) + row('Words per minute', Tc(s => s.wpm ?? '\u2013'), 'words \u00f7 speaking time')
      + row('Opinion signals', Tc(s => s.sig.opinion), 'I think, I believe\u2026') + row('Reason signals', Tc(s => s.sig.reason), 'because, one reason\u2026') + row('Example signals', Tc(s => s.sig.example), 'for example, such as\u2026') + row('Extra-detail signals', Tc(s => s.sig.extend), 'however, as a result, also\u2026')
      + row('New content words vs Round 1', Tc((s,i) => i === 0 ? '<span class="muted">baseline</span>' : newWords[i] ? `${newWords[i].length}${newWords[i].length ? `<div class="wl">${esc(newWords[i].slice(0,8).join(', '))}${newWords[i].length > 8 ? '\u2026' : ''}</div>` : ''}` : '\u2013'), 'a sign of new ideas')
      + row('Grammar suggestions', R.map(r => r.grammar && r.grammar.status === 'ok' ? r.grammar.issues.length : '<span class="muted">\u2013</span>'), 'LanguageTool, automatic')
      + row('Repeated 3-word phrases', Tc(s => `${s.repeated.length}${s.repeated.length ? `<div class="wl">${esc(s.repeated.slice(0,2).map(([g,c]) => `\u201c${g}\u201d \u00d7${c}`).join(', '))}</div>` : ''}`), 'repeating the same words'); }
  return `<div class="narrow" data-round="3" style="max-width:1000px">
    <div class="head"><p class="kicker">Results</p><h1 class="display">Your three rounds</h1><p class="sub">${esc(S.question.text)}</p></div>
    <div class="rcards">${cards}</div>
    <div class="card facts"><h2>What changed</h2><ul>${facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
    <div class="tbl"><table class="cmp"><thead><tr><th scope="col">Round by round</th>${[1,2,3].map(i => `<th scope="col" data-round="${i}"><i></i>Round ${i}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    ${anyTr ? `<div class="head left"><h2 class="display sm">Compare your transcripts</h2></div><div class="legend"><mark class="sig sig-opinion">opinion</mark><mark class="sig sig-reason">reason</mark><mark class="sig sig-example">example</mark><mark class="sig sig-extend">extra detail</mark></div>
      ${R.map((r,i) => `<div class="card trc" data-round="${i+1}"><h3>Round ${i+1}: ${ROUNDS[i].name}</h3><p>${r.transcript ? highlight(r.transcript) : '<span class="muted">No transcript for this round.</span>'}</p></div>`).join('')}` : ''}
    ${anyRec ? `<div class="card"><h2>Listen again</h2>${R.map((r,i) => r.url ? `<div class="player" data-round="${i+1}"><b style="min-width:72px">Round ${i+1}</b><audio controls preload="metadata" src="${r.url}"></audio><a class="btn line sm" href="${r.url}" download="round${i+1}-speaking.${extFor(r.mime)}">${ICON.download}</a></div>` : '').join('')}</div>` : ''}
    <form class="card" id="finalForm" novalidate><h2>My reflection</h2>

/* =====================================================================
   FEEDBACK BETWEEN ROUNDS (rules on the transcript + free LanguageTool grammar check, as in Story Cubes)
   ===================================================================== */
const LT_URL = 'https://api.languagetool.org/v2/check';
const LT_KEEP = ['GRAMMAR','CONFUSED_WORDS','COLLOCATIONS','NONSTANDARD_PHRASES','SEMANTICS'];
const LT_DELAYS = window.__ltDelays || [6000, 15000, 30000];
const IDEA_STOP = new Set(['believe','reason','reasons','example','instance','result','another','point','important','opinion','really','however','because','also','first','second','finally','addition','moreover','although','think','maybe','something','someone','everyone','everything','always','never','sometimes','often','very','much','many','more','most','good','bad','thing','things','people']);
const Q_GENERIC = new Set(['think','why','not','explain','answer','opinion','reasons','reason','examples','give','agree','your','yes','important','better','describe','talk']);
async function ltCheck(text){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(LT_URL, {method:'POST', body:new URLSearchParams({text, language:'en-US', level:'default'}), signal:ctl.signal});
    if (!r.ok) throw {code:r.status};
    const js = await r.json(), out = [];
    for (const m of (js && js.matches) || []){
      const cat = (m.rule && m.rule.category && m.rule.category.id) || '';
      if (!LT_KEEP.includes(cat)) continue;
      const wrong = text.substr(m.offset, m.length); if (!wrong.trim()) continue;
      const a = Math.max(0, text.lastIndexOf(' ', Math.max(0, m.offset - 22)) + 1), b = text.indexOf(' ', Math.min(text.length, m.offset + m.length + 22));
      out.push({wrong, fix: m.replacements && m.replacements[0] ? m.replacements[0].value : '', msg: String(m.shortMessage || m.message || '').slice(0, 110),
        before: text.slice(a, m.offset), after: text.slice(m.offset + m.length, b < 0 ? text.length : b)});
    }
    return out.slice(0, 12);
  } finally { clearTimeout(to); }
}
async function checkGrammar(n){
  const R = S.rounds[n-1], text = R.transcript, aid = S.aid;
  if (!text || wordCount(text) < 3){ R.grammar = {status:'short', issues:[]}; paintGrammar(n); return; }
  R.grammar = {status:'loading', issues:[]}; paintGrammar(n);
  for (let i = 0; i <= LT_DELAYS.length; i++){
    try {
      const issues = await ltCheck(text);
      if (S.aid !== aid || S.rounds[n-1] !== R) return;           // round was redone meanwhile
      R.grammar = {status:'ok', issues}; paintGrammar(n); sync(); return;
    } catch(e){
      if (S.aid !== aid || S.rounds[n-1] !== R) return;
      if (i === LT_DELAYS.length){ R.grammar = {status: navigator.onLine === false ? 'offline' : 'busy', issues:[]}; paintGrammar(n); return; }
      R.grammar = {status:'retry', issues:[]}; paintGrammar(n);
      await sleep(LT_DELAYS[i] + Math.random()*3000);
    }
  }
}
function paintGrammar(n){ const el = $(`#fbGram-${n}`); if (el) el.innerHTML = grammarHTML(n); }
const EXTEND_RE = /\b(however|on the other hand|as a result|another|in addition|moreover|although|instead|compared (to|with)|in conclusion)\b/gi;
const SPECIFIC_RE = /\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|fifty|hundred|thousand|percent|hours?|minutes?|days?|weeks?|months?|years?|yesterday|tomorrow|last|every|monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|june|july|august|september|october|november|december|istanbul|turkey|ankara|izmir|my (mother|father|brother|sister|cousin|friend|teacher|grandmother|grandfather))\b/gi;
function contentFeedback(n){
  const R = S.rounds[n-1], P = n > 1 ? S.rounds[n-2] : null, good = [], imp = [];
  const t = Math.round(R.duration), st = R.transcript ? textStats(R.transcript, R.duration) : null, ps = P && P.transcript ? textStats(P.transcript, P.duration) : null;
  const add = (arr, p, text) => arr.push({p, text});
  if (t >= 80) add(good, 1, `You used almost all of the 90 seconds (${t} s).`);
  else if (t < 45) add(imp, n === 1 ? 6 : 3, `You spoke for ${t} seconds. Aim for at least 60: add one more reason or example.`);
  if (P){ const d = t - Math.round(P.duration); if (d >= 10) add(good, 2, `You spoke ${d} seconds longer than in Round ${n-1}.`); }
  const a = R.analysis;
  if (a && a.reliable){
    if (a.pauses >= 4) add(imp, n === 3 ? 0 : 5, `You had about ${a.pauses} long pauses. When you need time, say “Let me think…” or “Another point is…” instead of stopping.`);
    else if (a.pauses <= 1 && t >= 45) add(good, 3, 'You spoke with very few long pauses.');
    if (a.startDelay > 4) add(imp, n === 3 ? 1 : 6, `You needed about ${Math.round(a.startDelay)} seconds to start. Begin with the words of the question: “I think young people…”.`);
  }
  if (st){
    const qw = [...new Set(contentWords(S.question.text))].filter(w => !Q_GENERIC.has(w));
    const hit = qw.filter(w => st.content.has(w) || st.content.has(w.replace(/s$/,'')) || st.content.has(w + 's'));
    if (qw.length && hit.length) add(good, 4, `You stayed on the question (you used: ${hit.slice(0,3).join(', ')}).`);
    else if (qw.length) add(imp, 1, `Use the key words of the question (${qw.slice(0,3).join(', ')}) so your answer is clearly on topic.`);
    if (st.sig.opinion) add(good, 0, 'You gave a clear opinion.'); else add(imp, 0, 'Start with a direct answer: “I believe that…” or “In my opinion,…”.');
    if (st.sig.reason >= 2) add(good, 0, `You explained your opinion with reasons (${st.sig.reason} reason words).`);
    else if (st.sig.reason === 1) add(imp, 3, 'You gave one reason. Add a second one: “Another reason is that…”.');
    else add(imp, 1, 'Explain why: use “because…” or “One reason is that…”.');
    if (st.sig.example) add(good, 1, 'You gave an example.'); else add(imp, 2, 'Give a specific example: “For example, my friend…”.');
    const ext = (R.transcript.match(EXTEND_RE) || []).length;
    if (ext) add(good, 2, 'You extended your answer with another point or view.'); else add(imp, 3, 'Add one more point or another view: “However,…” or “As a result,…”.');
    const spec = (R.transcript.match(SPECIFIC_RE) || []).length;
    if (spec >= 2) add(good, n === 2 ? 0 : 3, 'You included specific details (people, numbers, times or places).');
    else add(imp, n === 2 ? 1 : 4, 'Add a specific detail: a person, a number, a time or a place (e.g. “three hours a day”).');
    if (ps && n === 2){ const stem = w => w.length > 4 ? w.replace(/ies$/,'y').replace(/(ing|ed|es|s)$/,'') : w, old = new Set([...ps.content].map(stem)); const nw = [...st.content].filter(w => !old.has(stem(w)) && !IDEA_STOP.has(w) && w.length > 3).sort((x,y) => y.length - x.length); if (nw.length >= 5) add(good, 0, `You added new ideas: ${nw.slice(0,4).join(', ')}…`); else add(imp, 0, 'Your answer was very similar to Round 1. Add at least one new idea or detail.'); }
    if (ps && n === 3 && st.words < ps.words*0.7) add(imp, 2, `Round 3 had fewer words than Round 2 (${st.words} vs ${ps.words}). Did you keep all your ideas?`);
    const cnt = new Map(); contentWords(R.transcript).filter(w => w.length > 3).forEach(w => cnt.set(w, (cnt.get(w) || 0) + 1));
    const top = [...cnt].sort((x,y) => y[1]-x[1])[0];
    if (top && top[1] >= 4) add(imp, 4, `You said “${top[0]}” ${top[1]} times. Sometimes use another word, or “it” / “this”.`);
    if (st.repeated.length >= 3) add(imp, 5, `You repeated some phrases, e.g. “${st.repeated[0][0]}”.`);
  }
  const by = arr => arr.sort((x,y) => x.p - y.p).map(x => x.text);
  return {good:by(good).slice(0,5), imp:by(imp).slice(0,3), next:nextTip(n, st), hasText:!!st};
}
function nextTip(n, st){
  if (n === 1){
    const miss = !st ? [] : [!st.sig.opinion && 'ANSWER', !st.sig.reason && 'EXPLAIN', !st.sig.example && 'EXEMPLIFY', !(S.rounds[0].transcript.match(EXTEND_RE) || []).length && 'EXTEND'].filter(Boolean);
    return miss.length ? `In Round 2 you will learn four speaking moves. Your focus: ${miss.join(' and ')}.` : 'In Round 2, keep your four moves and add a new idea with a specific detail.';
  }
  if (n === 2) return 'In Round 3, say the same ideas more smoothly with only 3–5 keywords. Use complete sentences and keep going.';
  return 'Open your results to compare all three rounds.';
}
function grammarTips(text){
  const t = ' ' + String(text).toLowerCase() + ' ', tips = [];
  const story = /for example|for instance|when i was|last (year|week|month|summer|weekend)|yesterday|ago\b/.test(t);
  const past = (t.match(/\b(was|were|went|had|did|saw|made|got|came|took|said|told|bought|felt|thought|knew|left|met|ate|wrote|began|became|found|gave|spent|paid|lost|won|[a-z]+ed)\b/g) || []).length;
  if (story && past === 0) tips.push('When you tell a past example, use the past tense: “Last year I spent…”, “She worked…”.');
  if (!(t.match(/\b(if|when|which|who|although|while|unless|whereas)\b/g) || []).length) tips.push('Try one longer sentence with “if”, “when” or “which”: “If students use phones in class, they…”.');
  if (!/\b(should|could|would|might|have to|must)\b/.test(t) && /should|why or why not|do you agree|better/i.test(S.question.text)) tips.push('For opinions, use modal verbs: “Universities should…”, “It could help…”.');
  if (!tips.length) tips.push('Good range of sentences. Now check the small things: he/she/it + -s, and a / the.');

}
function grammarHTML(n){
  const R = S.rounds[n-1], g = R.grammar || {status:'none'};
  if (!R.transcript) return `<h3>Grammar</h3><p class="hint">Grammar feedback needs a transcript.${S.wantTr && ENV.SR ? '' : ' Turn on Automatic transcript in the mic check.'}</p>`;

function feedbackCard(n){

const PHASE_SCROLL = true;
function render(scroll=true){
  stopPlanTimer();
  let html = '';
  if (S.role === 'host') html = renderHost();
  else if (S.screen === 'landing') html = renderLanding();
  else if (S.screen === 'join') html = renderJoin();
  else if (S.screen === 'check') html = renderCheck();
  else if (S.screen === 'home') html = renderHome();

/* ---------- mic check ---------- */
function checkTimer(sec, withLevel){
  return new Promise(res => { const t0 = performance.now(); const iv = setInterval(() => {
    const el = (performance.now() - t0)/1000;
    if (withLevel){ const l = $('#chkLvl'); if (l) l.style.width = Math.min(100, Math.sqrt(Rec.level())*240) + '%'; }
    const s = $('#chkSec'); if (s) s.textContent = Math.max(0, Math.ceil(sec - el));
    if (el >= sec){ clearInterval(iv); res(); } }, 60); });
}
const showWords = e => { e.onUpdate = () => { const w = $('#chkWords'); if (w) w.textContent = e.live() ? '\u201c' + e.live() + '\u201d' : ''; }; };
async function runCheck(){
  if (S.check.state === 'running') return;
  Rec.prime();
  const useTr = S.wantTr && !!ENV.SR;
  let eng = null;
  if (useTr){ eng = new WebSpeechEngine(); eng.start(); } // same order as a real round: transcript first, then recorder
  if (S.check.url) URL.revokeObjectURL(S.check.url);
  S.check = {state:'running', phase:'both'};
  render(false);
  if (eng) showWords(eng);
  let gumErr = null, recording = false;
  if (ENV.canRecord){ try { await Rec.ensure(); Rec.connect(); Rec.start(); recording = true; } catch(e){ gumErr = e && e.name || 'Error'; } }
  await checkTimer(6, true);
  const rec = recording ? await Rec.stop() : null; Rec.release();
  const text = eng ? await eng.stop() : '';
  let peak = 0; if (rec) for (const v of rec.rms) if (v > peak) peak = v;
  const c = {state:'done', trTested:useTr, gumErr, peak, size: rec ? rec.blob.size : 0, words: wordCount(text), text, trErr: eng ? eng.error : null,
    url: rec && rec.blob.size ? URL.createObjectURL(rec.blob) : null, soloTried:false, soloWords:0, soloText:'', soloErr:null};
  const micOk = ENV.canRecord && !gumErr && c.size > 400 && peak > 0.004;
  // The student spoke and the recorder heard it, but the transcript got nothing: many phones can't do both at once.
  // Test the transcript on its own, because the teacher needs the words.
  if (useTr && micOk && peak > 0.02 && c.words < 2 && !HARD_TR.includes(c.trErr)){
    S.check = Object.assign({}, c, {state:'running', phase:'solo'}); render(false);
    const e2 = new WebSpeechEngine(); showWords(e2); e2.start();
    await checkTimer(5, false);
    const t2 = await e2.stop();
    Object.assign(c, {soloTried:true, soloWords:wordCount(t2), soloText:t2, soloErr:e2.error});
  }
  S.check = c; S.mode = decideMode(c);
  render(false); sync();
}
function decideMode(c){
  const micOk = ENV.canRecord && !c.gumErr && c.size > 400 && c.peak > 0.004;
  const tr = S.wantTr && !!ENV.SR;
  if (!tr) return (micOk || (ENV.canRecord && !c.gumErr)) ? 'record' : 'timer';
  if (micOk && c.words >= 2) return 'both';
  if (c.words >= 2 || c.soloWords >= 2) return 'transcript';
  if (!c.trTested) return micOk ? 'both' : defaultMode();
  if (micOk && c.peak > 0.02) return 'record';           // spoke clearly, transcript got nothing even alone
  if (!c.gumErr) return defaultMode();                    // heard nothing at all: keep the default, ask to test again
  return 'timer';
}
function trWhy(){
  if (S.mode === 'both' || S.mode === 'transcript') return '';
  if (!ENV.SR) return 'browser has no transcript';
  if (!S.wantTr) return 'student turned it off';
  const e = S.check && (S.check.soloErr || S.check.trErr);
  return e ? (TR_ERR[e] || e) : 'transcript not working on this device';
}

/* ---------- speaking ---------- */
const Session = {active:false, counting:false, round:0, timer:null, recording:false, engine:null, raf:0, wake:null, levels:[], lastAnn:0};
function setSpeak(state){
  const sp = $('#speak'); if (!sp) return;
  sp.dataset.state = state;
  const start = $('#startBtn'), stop = $('#stopBtn'), pill = $('#recPill'), hint = $('#speakHint');
  start.hidden = !(state === 'idle' || state === 'asking'); start.disabled = state === 'asking';
  start.innerHTML = state === 'asking' ? `${ICON.mic} Allow the microphone\u2026` : `${ICON.mic} Start speaking`;
  stop.hidden = !(state === 'live' || state === 'saving'); stop.disabled = state === 'saving';
  stop.innerHTML = state === 'saving' ? 'Saving\u2026' : `${ICON.stop} I\u2019ve finished`;
  if (state === 'live'){ pill.className = 'livepill ' + (Session.recording ? 'rec' : ''); pill.innerHTML = Session.recording ? 'Recording' : (Session.engine ? ICON.text + ' Listening' : ICON.timer + ' Timer running'); hint.textContent = 'Keep talking until the timer reaches 0:00.'; }
  if (state === 'countdown') hint.textContent = 'Get ready. Think of your first sentence.';
}
function onSpeakStart(n){
  if (Session.active || Session.counting) return;
  Session.counting = true;
  Rec.prime();
  const useTr = (S.mode === 'both' || S.mode === 'transcript') && ENV.SR;
  let engine = null;
  if (useTr){ engine = new WebSpeechEngine(); engine.start(); } // inside the tap, before any await
  beginSpeaking(n, engine, (S.mode === 'both' || S.mode === 'record') && ENV.canRecord);
}
async function beginSpeaking(n, engine, wantRec){
  let recording = false;
  if (wantRec){
    setSpeak('asking');
    try { await Rec.ensure(); Rec.connect(); recording = true; }
    catch(err){
      if (engine) engine.cancel(); engine = null; Session.counting = false; setSpeak('idle');
      const h = micHelp(err);
      const ch = await modal({title:h.title, body:h.body, buttons:[{id:'retry', label:'Try again', kind:'blue'}, {id:'timer', label: ENV.SR && S.mode === 'both' ? 'Continue with transcript only' : 'Continue without recording'}]});
      if (ch === 'retry'){ onSpeakStart(n); return; }
      if (ch !== 'timer') return;
      S.mode = ENV.SR && S.mode === 'both' && err.name !== 'NotAllowedError' ? 'transcript' : 'timer';
      render(false); return;
    }
  }
  setSpeak('countdown');
  for (let i = 3; i > 0; i--){
    const d = $('#digits'); if (!d){ Session.counting = false; if (engine) engine.cancel(); Rec.release(); return; }
    d.innerHTML = `<span style="width:auto">${i}</span>`; $('#ringL').textContent = 'Get ready\u2026'; tone(660, 0.09); await sleep(800);
  }
  if (!$('#speak')){ Session.counting = false; if (engine) engine.cancel(); Rec.release(); return; }
  tone(990, 0.16); await sleep(180);
  Object.assign(Session, {active:true, counting:false, round:n, recording, engine, levels:new Array(28).fill(0), lastAnn:0});
  if (recording){ try { Rec.start(); } catch(e){ Session.recording = false; } }
  Rec.onEnded = () => { if (Session.active) finishSpeaking(); };
  try { if (navigator.wakeLock) Session.wake = await navigator.wakeLock.request('screen'); } catch(e){ Session.wake = null; }
  setSpeak('live'); announce('Start speaking now. You have 90 seconds.');
  S.started = true; sync();
  Session.timer = new Countdown(90, (left, el) => updateTimer(n, left, el), () => finishSpeaking());
  Session.timer.start();
  if (Session.recording) meterLoop();
}
function updateTimer(n, left, el){

  d.innerHTML = digitsHTML(fmt(left));
  $('#ringP').style.strokeDashoffset = (CIRC*(1 - left/90)).toFixed(2);
  $('#trackF').style.width = Math.min(100, el/90*100) + '%';
  $('#speak').classList.toggle('low', left <= 10);
  const pr = ROUNDS[n-1].prompts; $('#ringL').textContent = el < 30 ? pr[0] : el < 60 ? pr[1] : pr[2];
  const w = Math.ceil(left); if ((w === 30 || w === 10) && Session.lastAnn !== w){ Session.lastAnn = w; announce(`${w} seconds left`); }
}
function meterLoop(){
  const bars = $$('#meter i');
  const step = () => { if (!Session.active) return; const v = Rec.level(); Session.levels.push(v); Session.levels.shift();
    bars.forEach((b,i) => { const h = Math.min(1, Math.sqrt(Session.levels[i])*2.4); b.style.height = (6 + h*40).toFixed(1) + 'px'; }); Session.raf = requestAnimationFrame(step); };

async function finishSpeaking(){
  if (!Session.active) return;
  Session.active = false; Rec.onEnded = null;
  const n = Session.round; Session.timer.stop();
  const elapsed = Math.min(90, Session.timer.elapsed());
  cancelAnimationFrame(Session.raf); setSpeak('saving');
  let rec = null; if (Session.recording){ try { rec = await Rec.stop(); } catch(e){ rec = null; } }
  Rec.release();
  let transcript = ''; if (Session.engine){ try { transcript = await Session.engine.stop(); } catch(e){} }
  if (Session.wake){ try { Session.wake.release(); } catch(e){} Session.wake = null; }
  tone(784, 0.14); tone(523, 0.22, 0.16);
  const R = S.rounds[n-1]; if (R.url) URL.revokeObjectURL(R.url);
  const an = rec ? analyzeLevels(rec.rms, rec.duration) : null;
  Object.assign(R, {done:true, doneAt:Date.now(), duration: rec ? Math.min(90, rec.duration) : elapsed,
    blob: rec && rec.blob.size ? rec.blob : null, url: rec && rec.blob.size ? URL.createObjectURL(rec.blob) : null, mime: rec ? rec.mime : '',
    analysis: an, peak: an ? an.peak : 0, transcript:(transcript || '').trim(), trTried:!!Session.engine, trError: Session.engine ? Session.engine.error : null});

    if (R.peak < 0.004 && words >= 3){ S.mode = 'transcript'; S.modeNote = 'transcript'; R.blob = null; if (R.url){ URL.revokeObjectURL(R.url); R.url = null; } }
    else if (!words && R.peak > 0.02){

      else if (R.trError !== 'network'){ S.mode = 'transcript'; S.modeNote = 'transcript'; } // the phone gave the mic to the recorder: keep the transcript next time
    }
  } else if (S.mode === 'transcript' && R.trTried && !words){
    S.mode = ENV.canRecord ? 'record' : 'timer'; S.modeNote = 'record';                      // transcript alone gave nothing either: record instead
  }

  render(); announce(`Round ${n} finished.`); awardBadges();
  checkGrammar(n);
  sync(true); sendAudio(n);
}
function abortSession(){

  Rec.release(); Rec.onEnded = null;
  if (Session.wake){ try { Session.wake.release(); } catch(e){} }

}

    () => { lockPlan(); tone(784, 0.14); render(false); announce('Planning time is over.'); });

}

function validKeyword(raw){ const t = raw.trim().replace(/\s+/g,' ').replace(/[.!?]+$/,''); if (!t) return {ok:false, msg:''}; if (t.split(' ').length > 3) return {ok:false, msg:'Keywords only: use 1 to 3 words, not a sentence.'}; return {ok:true, text:t}; }

  const inp = $(`#in-${m}`); if (!inp) return; const v = validKeyword(inp.value), err = $('#planErr');

  if (S.plan[m].length >= 5){ err.textContent = 'You have 5 keywords for this move. That is enough!'; err.hidden = false; return; }
  if (!S.plan[m].some(c => c.toLowerCase() === v.text.toLowerCase())) S.plan[m].push(v.text);
  err.hidden = true; inp.value = ''; $(`#kws-${m}`).innerHTML = kwsHTML(m, false); inp.focus();
}

function validateReflect(n){
  const f = S.rounds[n-1].self, need = MOVES.map(m => m.key).concat(n === 3 ? ['complete'] : []); let miss = 0;
  need.forEach(k => { const el = $(`.tri[data-key="${k}"]`), m = f[k] === null; if (el) el.classList.toggle('missing', m); if (m) miss++; });
  const fl = $('.flu'), fm = f.fluency === null; if (fl) fl.classList.toggle('missing', fm); if (fm) miss++;
  const err = $('#formErr');

  err.hidden = true; return true;
}
function summaryText(){

  L.push('90-Second Speaking Challenge: summary', 'Name: ' + (S.name || '-'), 'Date: ' + new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}), 'Question: ' + S.question.text, '');
  S.rounds.forEach((r,i) => { L.push(`Round ${i+1} (${ROUNDS[i].name}): ${Math.round(r.duration)} s`); L.push(`  Answered: ${yn(r.self.answered)} | Reasons: ${yn(r.self.reasons)} | Example: ${yn(r.self.example)} | Extra details: ${yn(r.self.extra)} | Fluency (self): ${r.self.fluency ?? '-'}/5`); if (r.transcript) L.push(`  Transcript (automatic): ${r.transcript}`); });
