  if (a.kw && a.kw.length) bits.push(`<span><b>Round 3 keywords:</b> ${esc(a.kw.join(', '))}</span>`);
  if (a.final && a.final.improved && a.final.improved.length) bits.push(`<span><b>What improved:</b> ${esc(a.final.improved.join(', '))}</span>`);
  if (a.final && a.final.next) bits.push(`<span><b>Next time:</b> ${esc(a.final.next)}</span>`);
  return bits.length ? `<div class="extra">${bits.join('')}</div>` : '';
}
const fileBase = a => ((a.name || 'student').normalize('NFKD').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') || 'student') + '_' + a.aid.slice(0,4);
function csvText(){
  const yn = v => v === 2 ? 'yes' : v === 1 ? 'a little' : v === 0 ? 'no' : '';
  const head = ['student','started','device','mode','question','round','round_name','duration_s','words','words_per_min','long_pauses_est','start_delay_est_s','answered','reasons','example','extra_details','fluency_1to5','complete_sentences','transcript','transcript_note','grammar_suggestions','round1_stuck','round2_new_idea','round2_plan','round3_keywords','improved','next_time'];
  const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = [head];
  Object.values(H.attempts).sort((a,b) => (a.name||'').localeCompare(b.name||'')).forEach(a => a.rounds.forEach((r,i) => {
    if (!r.done) return; const st = r.transcript ? textStats(r.transcript, r.duration) : null;
    rows.push([a.name, new Date(a.rounds[0].doneAt || a.ts).toLocaleString('en-GB'), a.device, a.mode, a.q ? a.q.text : '', i+1, ROUNDS[i].name, Math.round(r.duration), st ? st.words : '', st && st.wpm ? st.wpm : '', r.analysis ? r.analysis.pauses : '', r.analysis ? r.analysis.startDelay : '',
      yn(r.self.answered), yn(r.self.reasons), yn(r.self.example), yn(r.self.extra), r.self.fluency || '', i === 2 ? yn(r.self.complete) : '', r.transcript, r.transcript ? '' : (r.trTried ? (TR_ERR[r.trErr] || 'no words') : 'transcript off'), r.grammar && r.grammar.status === 'ok' ? r.grammar.issues.map(x => x.wrong + (x.fix ? ' -> ' + x.fix : '') + (x.msg ? ' (' + x.msg + ')' : '')).join('; ') : '',
      i === 0 ? (r.self.stuck || []).map(k => STUCK[k] ? STUCK[k].label : k).join('; ') + (r.self.stuckNote ? ' (' + r.self.stuckNote + ')' : '') : '', i === 1 ? r.self.newIdea : '',
      i === 1 && a.plan ? MOVES.map(m => m.name.toLowerCase() + ': ' + (a.plan[m.id] || []).join(', ')).join(' | ') : '', i === 2 ? (a.kw || []).join(', ') : '', i === 2 && a.final ? (a.final.improved || []).join('; ') : '', i === 2 && a.final ? a.final.next : '']);
  }));
  return '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n');
}
function plainText(){
  const L = ['90-Second Speaking Challenge: transcripts', 'Room ' + H.code + ' \u00b7 ' + new Date().toLocaleString('en-GB'), ''];
  Object.values(H.attempts).sort((a,b) => (a.name||'').localeCompare(b.name||'')).forEach(a => {
    L.push('==== ' + (a.name || 'No name') + ' ====', 'Question: ' + (a.q ? a.q.text : '-'));
    a.rounds.forEach((r,i) => { if (!r.done) return; L.push(`Round ${i+1} (${Math.round(r.duration)} s): ${r.transcript || '[no transcript]'}`); });
    L.push('');
  });
  return L.join('\n');
}
let zipLib = null;
function loadZip(){ if (window.JSZip) return Promise.resolve(window.JSZip); if (!zipLib) zipLib = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = () => res(window.JSZip); s.onerror = () => { zipLib = null; rej(new Error('zip')); }; document.head.appendChild(s); }); return zipLib; }
async function exportZip(){
  try {
    const JSZip = await loadZip(), zip = new JSZip();
    zip.file('transcripts.csv', csvText()); zip.file('transcripts.txt', plainText());
    Object.values(H.attempts).forEach(a => [1,2,3].forEach(n => { const au = H.audio[a.aid + '|' + n]; if (au) zip.file(`recordings/${fileBase(a)}_round${n}.${extFor(au.mime)}`, au.blob); }));
    const blob = await zip.generateAsync({type:'blob'});
    download(`speaking-challenge-${H.code}-${new Date().toISOString().slice(0,10)}.zip`, blob);
  } catch(e){ toast('Could not build the ZIP file. Try the CSV export.', 'Export problem', 'info'); }
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, n = +el.dataset.round || 0;
  switch (a){
    case 'solo': S.room = null; T = null; S.screen = 'check'; render(); break;
    case 'to-landing': S.screen = 'landing'; S.room = null; history.replaceState(null, '', location.pathname + (LOCAL ? '?local=1' : '')); render(); break;
    case 'run-check': runCheck(); break;
    case 'to-check': S.screen = 'check'; render(); sync(); break;
    case 'copy-page': { const ok = await copyText(location.href); toast(ok ? 'Paste it into Chrome or Safari.' : 'Copy the address from the address bar.', ok ? 'Link copied' : 'Could not copy', 'copy'); break; }
    case 'to-home': if (S.check.state === 'running') return; S.screen = 'home'; render(); sync(); break;
    case 'topic': S.topic = el.dataset.topic; render(false); break;
    case 'pick': selectQuestion(el.dataset.id, false); break;
    case 'random': { const pool = QUESTIONS.filter(q => (S.topic === 'all' || q.topic === S.topic) && q.id !== S.selectedId); selectQuestion((pool[Math.floor(Math.random()*pool.length)] || QUESTIONS[0]).id, true); break; }
    case 'begin': {
      const q = S.room && S.cfg.question ? QUESTIONS.find(x => x.id === S.cfg.question.id) || {id:S.cfg.question.id, text:S.cfg.question.text} : QUESTIONS.find(x => x.id === S.selectedId);
      if (!q) return; S.question = q; S.screen = 'r1'; render(); sync(); break;
    }
    case 'speak-start': onSpeakStart(n); break;
    case 'speak-stop': finishSpeaking(); break;
    case 'redo': {
      const c = await modal({title:`Redo Round ${n}?`, body:'Your recording and self-check for this round will be deleted, and you can speak again.', buttons:[{id:'yes', label:'Yes, redo it', kind:'blue'}, {id:'no', label:'Keep this take'}]});
      if (c !== 'yes') return; const R = S.rounds[n-1]; if (R.url) URL.revokeObjectURL(R.url);
      S.rounds[n-1] = newRound(); S.phase[n] = 'speak'; render(); sync(); break;
    }
    case 'tri': { S.rounds[n-1].self[el.dataset.key] = +el.dataset.v; $$(`.opt[data-key="${el.dataset.key}"][data-round="${n}"]`).forEach(b => b.setAttribute('aria-checked', String(b === el))); el.closest('.tri').classList.remove('missing'); break; }
    case 'flu': { S.rounds[n-1].self.fluency = +el.dataset.v; $$('.fo').forEach(b => b.setAttribute('aria-checked', String(b === el))); el.closest('.flu').classList.remove('missing'); break; }
    case 'stuck': { const f = S.rounds[0].self, v = el.dataset.v; if (v === 'none') f.stuck = f.stuck.includes('none') ? [] : ['none']; else { f.stuck = f.stuck.filter(x => x !== 'none'); f.stuck = f.stuck.includes(v) ? f.stuck.filter(x => x !== v) : f.stuck.concat(v); } $$('[data-a="stuck"]').forEach(b => b.setAttribute('aria-pressed', String(f.stuck.includes(b.dataset.v)))); break; }
    case 'next': {
      if (!validateReflect(n)) return;
      S.rounds[n-1].reflected = true; awardBadges();
      if (n === 1){ S.screen = 'r2'; S.phase[2] = 'learn'; } else if (n === 2){ S.screen = 'r3'; S.phase[3] = 'pick'; } else S.screen = 'results';
      S.modeNote = null; render(); sync(true); break;
    }
    case 'plan-start': S.phase[2] = 'plan'; S.planLocked = false; render(); sync(); break;
    case 'kw-add': addKw(el.dataset.move); break;
    case 'kw-del': { const m = el.dataset.move; S.plan[m].splice(+el.dataset.i, 1); $(`#kws-${m}`).innerHTML = kwsHTML(m, false); break; }
    case 'plan-done': lockPlan(); S.phase[2] = 'speak'; render(); sync(); break;
    case 'plan-go': S.phase[2] = 'speak'; render(); sync(); break;
    case 'pk': {
      const k = el.dataset.kw, sel = S.r3Keywords, err = $('#kwErr');
      if (sel.includes(k)) S.r3Keywords = sel.filter(x => x !== k);
      else if (sel.length >= 5){ err.textContent = 'You can choose up to 5 keywords. Remove one first.'; err.hidden = false; return; }
      else S.r3Keywords = sel.concat(k);
      err.hidden = true; el.setAttribute('aria-pressed', String(S.r3Keywords.includes(k))); updateKwCount(); break;
    }
    case 'kw-extra': addExtraKw(); break;
    case 'kw-lock': if (S.r3Keywords.length >= 3 && S.r3Keywords.length <= 5){ S.phase[3] = 'speak'; render(); sync(); } break;
    case 'improved': { const v = el.dataset.v; S.final.improved = S.final.improved.includes(v) ? S.final.improved.filter(x => x !== v) : S.final.improved.concat(v); el.setAttribute('aria-pressed', String(S.final.improved.includes(v))); break; }
    case 'finish': {
      if (!S.final.improved.length){ const er = $('#finalErr'); er.textContent = 'Choose at least one thing that improved.'; er.hidden = false; return; }
      S.screen = 'done'; render(); awardBadges(); sync(true); break;
    }
    case 'back-results': S.screen = 'results'; render(); break;
    case 'copy': { const ok = await copyText(summaryText()); toast(ok ? 'Paste it into your notes.' : 'Copying is blocked here.', ok ? 'Summary copied' : 'Could not copy', ok ? 'check' : 'copy'); break; }
    case 'again': {
      abortSession(); S.rounds.forEach(r => { if (r.url) URL.revokeObjectURL(r.url); });
      freshAttempt(); S.screen = 'home'; render(); sync(true); break;
    }
    // teacher
    case 'h-toggle': { const id = el.dataset.aid; if (H.open.has(id)) H.open.delete(id); else H.open.add(id); hostRefresh(); break; }
    case 'h-expand': { const items = attemptList(); const allOpen = items.every(x => H.open.has(x.aid)); items.forEach(x => allOpen ? H.open.delete(x.aid) : H.open.add(x.aid)); el.textContent = allOpen ? 'Open all' : 'Close all'; hostRefresh(); break; }
    case 'h-copylink': { const ok = await copyText(joinURL()); toast(ok ? 'Paste it in your class chat.' : 'Copying is blocked here.', ok ? 'Link copied' : 'Could not copy', 'copy'); break; }
    case 'h-qmode': { const v = el.dataset.v; H.cfg.question = v === 'fixed' ? (H.cfg.question || {id:QUESTIONS[0].id, text:QUESTIONS[0].text}) : null; H.T && H.T.setCfg(H.cfg); hostSave(); render(false); break; }
    case 'h-qrand': { const pool = QUESTIONS.filter(x => !H.cfg.question || x.id !== H.cfg.question.id); const q = pool[Math.floor(Math.random()*pool.length)]; H.cfg.question = {id:q.id, text:q.text}; H.T && H.T.setCfg(H.cfg); hostSave(); render(false); break; }
    case 'h-csv': download(`speaking-challenge-${H.code}-${new Date().toISOString().slice(0,10)}.csv`, new Blob([csvText()], {type:'text/csv;charset=utf-8'})); break;
    case 'h-zip': exportZip(); break;
    case 'h-copy': { const ok = await copyText(plainText()); toast(ok ? 'All transcripts are on your clipboard.' : 'Copying is blocked here.', ok ? 'Copied' : 'Could not copy', 'copy'); break; }
    case 'h-new': {
      const c = await modal({title:'Start a new room?', body:'All transcripts and recordings on this screen will be deleted. Export them first if you want to keep them.', buttons:[{id:'yes', label:'Delete and start a new room', kind:'stop'}, {id:'no', label:'Keep this room'}]});
      if (c !== 'yes') return;
      Object.values(H.audio).forEach(x => x.url && URL.revokeObjectURL(x.url));
      H.attempts = {}; H.audio = {}; H.open = new Set(); H.code = newCode(); await IDB.clear(); hostSave(); hostConnect(); render(false); break;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.a === 'pair') S.pair = el.checked;
  if (el.dataset.a === 'tr-toggle'){
    S.wantTr = el.checked; ME.wantTr = el.checked; LS.set('spk90.me', ME);
    S.mode = S.check.state === 'done' ? decideMode(S.check) : defaultMode();
    render(false); sync();
  }
  if (el.dataset.a === 'h-audio'){ H.cfg.audio = el.checked; H.T && H.T.setCfg(H.cfg); hostSave(); }
  if (el.id === 'qSel'){ const q = QUESTIONS.find(x => x.id === el.value); H.cfg.question = {id:q.id, text:q.text}; H.T && H.T.setCfg(H.cfg); hostSave(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'hSearch'){ H.filter = el.value; hostRefresh(); return; }
  if (el.id === 'codeIn'){ el.value = cleanCode(el.value); return; }
  const f = el.dataset.field; if (!f) return;
  if (f === 'next') S.final.next = el.value; else if (/^r[123]$/.test(S.screen)) S.rounds[+S.screen[1]-1].self[f] = el.value;
});
document.addEventListener('keydown', e => {
  const el = e.target; if (e.key !== 'Enter' || el.tagName !== 'INPUT') return;
  if (el.dataset.move){ e.preventDefault(); addKw(el.dataset.move); }
  else if (el.id === 'kwNew'){ e.preventDefault(); addExtraKw(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'codeForm'){
    const c = cleanCode($('#codeIn').value);
    if (c.length < 4){ const er = $('#codeErr'); er.textContent = 'Type the room code from the board.'; er.hidden = false; return; }
    S.room = c; S.screen = 'join'; history.replaceState(null, '', '?room=' + c + (LOCAL ? '&local=1' : '')); render();
  }
  if (e.target.id === 'nameForm'){
    const nm = $('#nameIn').value.trim().replace(/\s+/g,' ');
    if (nm.length < 2){ const er = $('#nameErr'); er.textContent = 'Please type your name.'; er.hidden = false; return; }
    S.name = nm; ME.name = nm; LS.set('spk90.me', ME);
    S.screen = 'check'; render(); joinRoom(S.room);
  }
});
window.addEventListener('beforeunload', e => {
  if (S.role === 'host') return;
  const unsent = T && sendState() !== 'saved' && S.started;
  if ((S.rounds.some(r => r.url) && S.screen !== 'landing') || unsent){ e.preventDefault(); e.returnValue = ''; }
});

/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  const role = params.get('role'), room = cleanCode(params.get('room'));
  if (role === 'host'){ startHost(); return; }
  if (room){ S.room = room; S.screen = 'join'; }
  render(false);
})();
</script>
