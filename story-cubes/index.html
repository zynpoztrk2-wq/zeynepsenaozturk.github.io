<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Story Cubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800;900&display=swap">
<style>
:root{
  --bg:#F1EDFF; --bg2:#E6E0FF; --ink:#2E2547; --muted:#6E6690; --card:#FFFFFF; --line:#DCD4F7;
  --accent:#7C5CFF; --accent-ink:#FFFFFF; --go:#22B573; --stop:#FF5A6E; --gold:#FFC23D;
  --ok:#22B573; --ok-soft:#DDF7EA; --half:#E6A100; --half-soft:#FFF2CC; --bad:#E5484D; --bad-soft:#FFE1E3; --none:#A69FC2;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 12% 18%,#fff6 0 60px,transparent 61px),radial-gradient(circle at 88% 8%,#fff5 0 90px,transparent 91px),radial-gradient(circle at 70% 92%,#fff4 0 70px,transparent 71px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:800;background:var(--card);box-shadow:0 3px 0 var(--line);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #5A3FD9}
.btn.green{background:var(--go);color:#fff;box-shadow:0 4px 0 #168A57}
.btn.stop{background:var(--stop);color:#fff;box-shadow:0 4px 0 #C93A4C}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn.big{font-size:20px;padding:14px 26px;border-radius:18px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);white-space:nowrap}
.pill.ok{border-color:var(--ok);color:#137A4D}.pill.warn{border-color:var(--half);color:#8A6000}.pill.err{border-color:var(--bad);color:var(--bad)}
.small{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:60;max-width:90vw;text-align:center;animation:pop .25s}
.banner{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:14px 26px;border-radius:18px;font-family:var(--display);font-size:24px;font-weight:800;z-index:60;box-shadow:0 6px 0 #D59A00;animation:pop .3s}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.modal{position:fixed;inset:0;background:#2E254766;display:grid;place-items:center;z-index:70;padding:16px}
.mbox{background:var(--card);border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ---------- cubes ---------- */
.cube{position:relative;aspect-ratio:1;border-radius:22%;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--tint,#C9B6FF),0 10px 18px #2E254722;display:grid;place-items:center;padding:12%}
.cube svg{width:100%;height:100%;display:block}
.cube.roll{animation:tumble .9s cubic-bezier(.25,1.4,.5,1) both;animation-delay:var(--d,0s)}
@keyframes tumble{0%{transform:translateY(-60px) rotate(-200deg) scale(.4);opacity:0}60%{opacity:1}100%{transform:none}}
.cube .wv{animation:wv 1.2s ease-in-out infinite;transform-origin:70px 50px}
@keyframes wv{50%{opacity:.35;transform:translateX(3px)}}
.cube.genre{background:#FFFBEA;border-style:dashed}
.cw{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.cw .cube{width:100%}
.cl{font-weight:900;font-size:13px;line-height:1.35;color:var(--ink);background:var(--gold);border-radius:999px;padding:1px 9px;max-width:100%;text-align:center;overflow-wrap:anywhere}
.cube.hinted::after{content:"💡";position:absolute;top:-10px;right:-10px;font-size:18px;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink)}
@media (prefers-reduced-motion:reduce){.cube.roll,.cube .wv{animation:none}}
/* 3D dice */
.dicerow{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:flex-start}
.die3{position:relative;width:var(--s);height:var(--s);perspective:calc(var(--s) * 6);flex:none}
.die3::after{content:"";position:absolute;left:12%;right:12%;bottom:-16%;height:12%;background:#2E254726;border-radius:50%;filter:blur(3px)}
.dcube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(22deg)}
.die3.idle .dcube{animation:idle 6s linear infinite;animation-delay:calc(var(--dl) * -6)}
@keyframes idle{from{transform:rotateX(-18deg) rotate3d(1,1,.3,0deg)}to{transform:rotateX(-18deg) rotate3d(1,1,.3,360deg)}}
.dface{position:absolute;inset:0;background:#fff;border:calc(var(--s) * .035) solid var(--ink);border-radius:14%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:8% 5%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 calc(var(--s) * -.07) 0 var(--tint)}
.di{width:46%;aspect-ratio:1;color:var(--ink);display:block}
.di svg{width:100%;height:100%;display:block}
.dw{font-family:var(--body);font-weight:900;line-height:1.05;text-align:center;color:var(--ink);overflow-wrap:normal;word-break:normal;hyphens:none;max-width:100%}
.gdie .di{color:#9A6B00}
.cube.flat{width:var(--s);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:8% 5%;border-width:3px}
.genretag .gi{width:30px;height:30px;flex:none;color:#9A6B00}.genretag .gi svg{width:100%;height:100%}
.tasks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tk{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-weight:900;font-size:13px;color:var(--bad)}
.tk.on{border-color:var(--ok);background:var(--ok-soft);color:#0E6B42}
.part.bonus{background:#FFF2CC;color:#7A5600}
.dface.f0{transform:translateZ(calc(var(--s) / 2))}.dface.f1{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.dface.f2{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}.dface.f3{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.dface.f4{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}.dface.f5{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.gdie .dface{background:#FFFBEA;border-style:dashed}
.die3.hinted::before{content:"💡";position:absolute;top:-14px;right:-14px;z-index:3;font-size:16px;background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink)}
.die3[data-act]{cursor:pointer}
.dlab{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);font-weight:900;font-size:12px;background:var(--gold);border-radius:999px;padding:0 8px;white-space:nowrap}
.pdice{display:flex;justify-content:center;margin:40px 0 36px}
.gcard .dicerow{gap:8px 8px;padding:4px 0 6px}
.pdice .dicerow{justify-content:center;gap:36px 44px;max-width:420px}
@media (prefers-reduced-motion:reduce){.die3.idle .dcube{animation:none}}

/* ---------- board ---------- */
.board{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--card);border-bottom:3px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:24px;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:800}
.topbar .grow{flex:1}
.timer{font-family:var(--display);font-weight:800;font-size:30px;background:var(--ink);color:#fff;border-radius:14px;padding:0 16px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{background:var(--stop);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.bodyrow{flex:1;display:flex;align-items:flex-start}
.stage{flex:1;min-width:0;padding:18px 22px 40px}
.chatp{width:300px;flex:none;background:var(--card);border-right:3px solid var(--line);display:flex;flex-direction:column;position:sticky;top:var(--tb,62px);height:calc(100vh - var(--tb,62px))}
.ch-head{display:flex;align-items:center;gap:6px;padding:12px 12px 8px}
.ch-head h3{flex:1;font-size:20px}
.ch-head button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:3px 8px;font-size:13px;font-weight:800}
.ch-head button.off{background:var(--bad-soft);border-color:var(--bad)}
.ch-off{margin:0 12px 6px;padding:6px 10px;border-radius:10px;background:var(--bad-soft);font-size:13px;font-weight:800;text-align:center}
.ch-list{flex:1;overflow:auto;padding:4px 12px 10px;display:flex;flex-direction:column;gap:8px}
.ch-empty{color:var(--muted);font-size:14px;text-align:center;margin-top:20px}
.msg{position:relative;background:var(--bg);border-radius:14px;padding:7px 11px;border-left:5px solid var(--c,#bbb);animation:msgin .3s}
@keyframes msgin{from{transform:translateY(8px);opacity:0}}
.msg .who{font-size:12px;font-weight:900;color:var(--c,#888);filter:brightness(.8)}
.msg .txt{font-size:14px;overflow-wrap:anywhere}
.msg.sys{background:#FFF8E1;border-left-color:var(--gold)}
.msg.story .txt{font-style:italic}
.msg.teacher{background:#EFEAFF}
.msg.me{background:#EAF4FF}
.msg .del{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:12px;opacity:0}
.msg:hover .del{opacity:1}
.ch-form{display:flex;gap:6px;padding:10px 12px;border-top:2px solid var(--line)}
.ch-form input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit}
.ch-form .btn{padding:8px 12px}
.chat-tab{position:fixed;left:0;top:50%;z-index:20;border:0;background:var(--card);border-radius:0 14px 14px 0;padding:12px 10px;box-shadow:0 4px 12px #2E254733;font-size:20px}
.chat-tab span{display:block;font-size:12px;font-weight:900;color:var(--stop)}

.lobby{display:grid;grid-template-columns:minmax(260px,330px) 1fr minmax(280px,360px);gap:18px;align-items:start}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--line)}
.join{text-align:center}
.join h2{font-size:26px;margin-bottom:8px}
.qr{width:220px;max-width:100%;aspect-ratio:1;margin:6px auto;display:grid;place-items:center;background:#fff;border-radius:14px}
.qr svg{width:100%;height:auto}
.code{font-family:var(--display);font-size:46px;font-weight:800;letter-spacing:6px;line-height:1}
.link{font-size:12px;word-break:break-all;color:var(--muted);margin-top:6px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.warnbox{background:var(--half-soft);border-radius:12px;padding:10px;font-size:14px;font-weight:700;margin-top:10px;text-align:left}
.settings h3{font-size:22px;margin-bottom:6px}
.set{margin:12px 0}
.set>span{display:block;font-weight:900;font-size:14px;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;min-width:42px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:800;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gcol{background:var(--card);border-radius:18px;border-top:8px solid var(--c);padding:10px 12px;min-height:110px;box-shadow:0 4px 0 var(--line)}
.ghead{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:19px}
.ghead .em{font-size:24px}
.ghead .cnt{margin-left:auto;font-family:var(--body);font-size:13px;background:var(--bg);border-radius:999px;padding:1px 9px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.names button{border:0;background:var(--bg);border-radius:999px;padding:3px 10px;font-weight:800;font-size:14px}
.names button.off{opacity:.45}
.unass{background:var(--half-soft);border-radius:14px;padding:8px 12px;margin-bottom:12px;font-weight:800;font-size:14px}

.scorestrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.schip{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 12px 4px 6px;font-weight:900;border:3px solid var(--c);font-variant-numeric:tabular-nums}
.schip .em{font-size:20px}
.schip b{font-family:var(--display);font-size:20px}
.schip .rk{font-size:12px;color:var(--muted)}
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.phead h1{font-size:34px;flex:1}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.gcard{background:var(--card);border-radius:22px;padding:14px;border-top:10px solid var(--c);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard .ghead small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:800;margin-left:auto}
.cubes{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:8px}
.cubes .cube{border-width:2.5px;box-shadow:0 4px 0 var(--tint,#C9B6FF);border-radius:18%;padding:10%}
.cubes .cl{font-size:11px;padding:0 6px;line-height:1.3}
.genretag{display:flex;align-items:center;gap:8px;background:#FFFBEA;border:2px dashed #E9C46A;border-radius:14px;padding:4px 10px;font-weight:900;font-size:14px}
.genretag svg{width:30px;height:30px;flex:none}
.draft{background:var(--bg);border-radius:14px;padding:10px 12px;min-height:84px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap;max-height:220px;overflow:auto}
.draft.empty{color:var(--muted);font-style:italic}
.draft .by{display:block;font-size:12px;font-weight:900;color:var(--muted);margin-bottom:3px;white-space:normal}
.typing::after{content:" ✍️";animation:pulse 1s infinite;display:inline-block}
.status{font-weight:900;font-size:14px;display:flex;align-items:center;gap:6px}
.status.done{color:#137A4D}
.spin{width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.story{font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.story mark{border-radius:6px;padding:0 3px;font-weight:800;background:var(--ok-soft);color:#0E6B42}
.story mark.form{background:var(--half-soft);color:#7A5600}
.story mark.meaning{background:var(--bad-soft);color:#B4232A}
.story .err{text-decoration:underline wavy var(--bad);text-underline-offset:4px;text-decoration-thickness:2px}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-weight:900;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.wchip.correct,.wchip.used{border-color:var(--ok);background:var(--ok-soft)}
.wchip.form{border-color:var(--half);background:var(--half-soft)}
.wchip.meaning{border-color:var(--bad);background:var(--bad-soft)}
.wchip.missing{color:var(--none)}.wchip.missing .ww{text-decoration:line-through}
.fixes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fixes li{background:var(--bg);border-radius:10px;padding:4px 9px}
.fixes del{color:var(--bad);text-decoration-thickness:2px}
.fixes ins{color:#0E6B42;text-decoration:none;font-weight:900}
.fixes .ty{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-left:4px}
.scorebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bigscore{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--accent)}
.bigscore small{font-size:18px;color:var(--muted)}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.part{background:var(--bg);border-radius:12px;padding:4px 10px;font-weight:900;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.part button{border:0;background:var(--card);border-radius:8px;width:24px;height:24px;font-weight:900;padding:0}
.by{font-size:11px;font-weight:900;color:var(--muted)}
.praise{font-weight:800;color:#137A4D;font-size:14px}
.endwrap{max-width:900px;margin:0 auto;text-align:center}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:26px 0 14px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:160px}
.pod .em{font-size:56px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.pod .nm{font-family:var(--display);font-weight:800;font-size:22px}
.pod .blk{width:100%;background:var(--c);border-radius:16px 16px 0 0;color:#fff;font-family:var(--display);font-size:48px;font-weight:800;display:grid;place-items:center;border:3px solid var(--ink);border-bottom:0}
.others{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- phone ---------- */
body.student{background:var(--bg)}
.phone{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:14px;padding-block:10px 90px}
.sbar{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.tbadge{font-family:var(--display);font-weight:800;font-size:20px;flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.tbadge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stimer{font-family:var(--display);font-weight:800;font-size:22px;background:var(--ink);color:#fff;border-radius:12px;padding:0 12px;font-variant-numeric:tabular-nums}
.stimer.low{background:var(--stop)}
.scard{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--line)}
.center{text-align:center}
.logo{font-size:52px}
.in{width:100%;border:3px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:18px;font-weight:700;background:#fff}
.landing{min-height:100%;display:grid;place-items:center;padding:16px}
.landing .scard{max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pickgrid button{border:3px solid var(--c);background:#fff;border-radius:18px;padding:12px 8px;font-family:var(--display);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center}
.pickgrid button .em{font-size:32px}
.pickgrid button small{font-family:var(--body);font-size:12px;color:var(--muted)}
.pcubes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;margin:6px 0 18px}
.pcubes .cube{cursor:pointer}
.sgenre{margin-bottom:12px}
.sgenre .genretag{font-size:16px}
textarea.story-in{width:100%;min-height:180px;border:3px solid var(--line);border-radius:18px;padding:12px 14px;font:inherit;font-size:17px;line-height:1.5;resize:vertical;background:#fff}
.mates{font-size:13px;font-weight:800;color:var(--muted);margin:6px 0}
.wc{font-size:13px;font-weight:800;color:var(--muted);text-align:right;margin-top:4px}
.chatfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 5px 0 #5A3FD9;z-index:30}
.chatfab .badge{position:absolute;top:-4px;right:-4px;background:var(--stop);color:#fff;font-size:12px;font-weight:900;border-radius:999px;padding:1px 6px}
.sheet{position:fixed;inset:0;background:#2E254755;z-index:40;display:flex;align-items:flex-end}
.sheet-box{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;height:70vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;padding:12px 14px;border-bottom:2px solid var(--line)}
.sheet-head b{flex:1;font-family:var(--display);font-size:20px}
.sheet-head button{border:0;background:none;font-size:20px}
.sconn{position:fixed;left:12px;bottom:12px;z-index:5}
.hintpop{position:fixed;inset:0;background:#2E254766;z-index:50;display:grid;place-items:center;padding:16px}
.hintpop .scard{max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.hintpop .cw{width:120px}

@media (max-width:760px){.lobby{grid-template-columns:1fr}.chatp{display:none}}

function confetti(n = 90) { const cs = ['#ff5a5f', '#3a86ff', '#2bb673', '#ffc83d', '#9b5de5', '#ff7a00', '#fff']; for (let i = 0; i < n; i++) { const c = el('<i class="confetti"></i>'); c.style.left = Math.random() * 100 + 'vw'; c.style.background = cs[i % cs.length]; c.style.animationDuration = 2.2 + Math.random() * 2.2 + 's'; c.style.animationDelay = Math.random() * .8 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 5500); } }
const params = new URLSearchParams(location.search);

// ---------------- connection status pill ----------------
function setPill(id, state, text) { const p = document.getElementById(id); if (!p) return; p.className = 'pill ' + (state === 'online' ? 'ok' : state === 'offline' ? 'err' : 'warn'); p.textContent = text; p.hidden = false; }

// ---------------- db writer (one write at a time per doc) ----------------
class DocWriter {
  constructor(ref) { this.ref = ref; this.next = null; this.busy = false; }
  write(d) { this.next = d; this.kick(); }
  async kick() {
    if (this.busy || !this.next) return;
    const d = this.next; this.next = null; this.busy = true;
    try { await this.ref.set(d); }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' || c === 'resource_exhausted') { if (!this.next) this.next = d; await sleep(c === 'resource_exhausted' ? 2500 : 900 + Math.random() * 600); }
      else console.warn('db write failed', c, e && e.message);
    }
    this.busy = false; if (this.next) this.kick();
  }
}

// ---------------- transports ----------------
function claudeHostTransport(room, db) {
  const writers = {};
  const W = path => writers[path] || (writers[path] = new DocWriter(db.doc(path)));
  const bySid = new Map(); // peer -> sid
  let onState = null, onLeave = null;
  return {
    kind: 'claude',
    publish(part, data) { W('game/' + part).write(data); },
    save(data) { W('host/state').write(data); },
    async load() { try { const s = await withTimeout(db.doc('host/state').get(), 8000); return s.exists ? s.data() : null; } catch (e) { return null; } },
    listen(st, lv) {
      onState = st; onLeave = lv;
      room.onPeers(ch => {
        for (const p of [...ch.joined, ...ch.updated]) {
          const pr = p.presence || {};
          if (p.kind === 'viewer' && pr.role === 'student' && typeof pr.sid === 'string') { bySid.set(p.peer, pr.sid); onState(pr); }
        }
        for (const p of ch.left) {
          const sid = bySid.get(p.peer); bySid.delete(p.peer);
          if (sid && ![...bySid.values()].includes(sid)) onLeave(sid);
        }
      }, e => setPill('connPill', 'offline', 'Live link off (' + (e && e.code) + ')'));
      room.onConnection(c => setPill('connPill', c ? 'online' : 'connecting', c ? 'Live' : 'Connecting…'));
      room.presence({ role: 'host' }).catch(() => {});
    },
    replay() { for (const p of room.peers()) { const pr = p.presence || {}; if (p.kind === 'viewer' && pr.role === 'student' && typeof pr.sid === 'string') onState(pr); } }
  };
}
function claudeStudentTransport(room, db) {
  return {
    kind: 'claude',
    send(st) { room.presence(st).catch(e => console.warn('presence', e && e.code, e && e.message)); },
    subscribe(onPart) {
      for (const part of ['live']) db.doc('game/' + part).onSnapshot(s => onPart(part, s.exists ? s.data() : null, s.metadata || {}), e => setPill('sConn', 'offline', 'Connection lost'));
      room.onConnection(c => setPill('sConn', c ? 'online' : 'connecting', c ? 'Connected' : 'Connecting…'));
    }
  };
}
let peerLib = null;
function loadPeer() {
  if (peerLib) return peerLib;
  peerLib = new Promise((res, rej) => {
    if (window.Peer) return res(window.Peer);
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = () => res(window.Peer); s.onerror = () => rej(new Error('PeerJS failed to load')); document.head.appendChild(s);
  });
  return peerLib;
}
function peerOpts() {
  const o = { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] } };
  if (params.get('ph')) { o.host = params.get('ph'); o.port = +(params.get('pp') || 9000); o.path = params.get('pa') || '/'; o.secure = params.get('ps') === '1'; }
  return o;
}
const hostPeerId = code => 'storycubes10-' + String(code).toLowerCase();
function p2pHostTransport(getCode, onCodeChange) {
  const latest = {}; const conns = new Map(); const states = new Map();
  let peer = null, onState = null, onLeave = null, tries = 0;
  const T = {
    kind: 'p2p',
    publish(part, data) { latest[part] = data; for (const c of conns.keys()) if (c.open) { try { c.send({ t: 'p', p: part, d: data }); } catch (e) {} } },
    save(data) { LS.set('sc.host', data); },
    async load() { return LS.get('sc.host', null); },
    listen(st, lv) { onState = st; onLeave = lv; open(); },
    replay() { for (const s of states.values()) onState(s); }
  };

    const Peer = window.Peer;
    try { if (peer) peer.destroy(); } catch (e) {}
    setPill('connPill', 'connecting', 'Opening room…');
    peer = new Peer(hostPeerId(getCode()), peerOpts());
    peer.on('open', () => { tries = 0; setPill('connPill', 'online', 'Room open'); });

  let peer = null, conn = null, latest = null, onPart = null, timer = null;

    kind: 'p2p', code,
    send(st) { latest = st; if (conn && conn.open) { try { conn.send({ t: 'st', s: st }); } catch (e) {} } },
    subscribe(fn) { onPart = fn; start(); }
  };

    setPill('sConn', 'connecting', 'Connecting…');
    peer = new window.Peer(peerOpts());
    peer.on('open', () => connect());
    peer.on('error', e => { if (e.type === 'peer-unavailable') { setPill('sConn', 'offline', 'Game not found — check the code'); later(3000); } else { setPill('sConn', 'connecting', 'Connecting…'); later(3000); } });

    if (!peer || peer.disconnected || (conn && conn.open)) { if (peer && peer.disconnected) later(2000); return; }

    c.on('error', () => {});
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && peer && !(conn && conn.open)) later(200); });
  return T;
}

    st.innerHTML = `<div class="scard center"><div class="logo">${TEAMS[t].emoji}</div><h2>You're in the ${esc(TEAMS[t].name)}!</h2><p class="muted" style="font-weight:700">Wait for your teacher to give out the dice. Then roll them and write <b>one text</b> together with the words that land face-up.</p>
      <div class="mates" id="mates"></div><button class="btn ghost" data-act="repick">Change group</button></div>`;
  } else if (v === 'write' && !sub && S.sub) {
    st.innerHTML = `<div class="scard center"><div class="logo">📤</div><h2>Sending your story…</h2><p class="muted" style="font-weight:700">Keep this page open.</p><div class="story" style="text-align:left;margin-top:10px">${esc(S.sub[1])}</div></div>`;
  } else if (v === 'write' && !sub && !(L.rolled && L.rolled[t])) {
    st.innerHTML = `<div class="scard center"><h2>Roll your dice! 🎲</h2><p class="muted" style="font-weight:700;margin:6px 0 0">One roll per group. The words that land face-up are your words.</p></div>
      <div class="pdice">${diceRow((L.dice && L.dice[t]) || [], null, [], -1, { s: 88 })}</div>
      <button class="btn go big" data-act="roll" style="width:100%" ${S.rollReq ? 'disabled' : ''}>${S.rollReq ? 'Rolling…' : '🎲 Roll our dice'}</button><div class="mates" id="mates"></div>`;
  } else if (v === 'write' && !sub) {
    const cubes = (L.cubes && L.cubes[t]) || [];
    if (!S.anim) S.anim = {};
    const ak = L.gid + ':' + L.round; const animate = !S.anim[ak]; S.anim[ak] = 1;
    st.innerHTML = `<div class="pdice">${diceRow(L.dice[t], L.rolled[t], cubes, L.genre[t], { s: 104, animate })}</div>
      <div class="sgenre">${genreHTML(L.genre[t], true)}</div>
      <p class="small" style="font-weight:800;margin:0 0 6px">Write <b>one text for your group</b> (at least ${MIN_WORDS} words). Use all your words: <b>${cubes.map(esc).join(' · ')}</b> (+1 bonus if every word is correct).</p>
      <textarea class="story-in" id="storyIn" placeholder="${L.genre[t] >= 0 && GENRES[L.genre[t]].start ? esc(GENRES[L.genre[t]].start) + '…' : 'Start writing…'}" maxlength="1500"></textarea>
      <div class="wc" id="wc">${wordCount(S.draft)} words</div><div class="mates" id="mates"></div>
      <button class="btn green big" data-act="send" style="width:100%;margin-top:8px">📤 Send our story</button>`;
    const ta = $('#storyIn'); ta.value = S.draft; if (keepFocus) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    runRolls(st);
  } else if (v === 'write' || v === 'results') {
    st.innerHTML = `<div class="scard" style="display:flex;flex-direction:column;gap:10px">${sub ? `<h2>${sub.st === 'done' ? 'Your score 🎉' : 'Text sent! 📤'}</h2>${resultBlock(L.round, t, sub, false)}` : '<h2>Time is up!</h2><p class="muted">Your group did not send a story this round.</p>'}</div>
      ${L.cubes && L.cubes[t] ? `<div class="pcubes" style="margin-top:16px">${L.cubes[t].map((w, i) => cubeHTML(w, i, { s: 96 })).join('')}</div>` : ''}
      ${v === 'results' ? rankHTML(t) : '<p class="muted center" style="font-weight:800">Wait for the other groups…</p>'}`;
  } else if (v === 'end') {
    st.innerHTML = `<div class="scard center"><div class="logo">🏆</div><h2>Game over!</h2>${rankHTML(t)}</div>`;
  }
  updMates(); sTimer();
}
function rankHTML(t) {
  const sc = S.live.totals || []; const order = sc.map((x, i) => i).sort((a, b) => sc[b] - sc[a]);
  return `<div class="scorestrip" style="justify-content:center;margin-top:12px">${order.map((i, k) => `<div class="schip" style="--c:${TEAMS[i].color}${i === t ? ';background:#FFF7D6' : ''}"><span class="rk">${k + 1}.</span><span class="em">${TEAMS[i].emoji}</span><b>${fmtPts(sc[i])}</b></div>`).join('')}</div>`;
}
function updMates() {
  const m = $('#mates'); if (!m || !S.live) return; const t = myTeam();
  const mates = Object.entries(S.live.roster).filter(([sid, r]) => r[1] === t && sid !== S.sid).map(([, r]) => r[0]);
  const d = S.live.drafts && S.live.drafts[t];
  let txt = mates.length ? '👥 With you: ' + mates.join(', ') : '👥 You are the only one in this group so far.';
  if (sPhase() === 'write' && d && d[2] !== S.sid) txt += ` · ✍️ ${d[0]} is writing too — choose one writer!`;
  m.textContent = txt;
}
function onStudentSubmit(e) {
  if (e.target.id !== 'joinF') return; e.preventDefault();
  const n = clean($('#nameIn').value, 20); if (!n) { $('#nameIn').focus(); return; }
  if (MODE === 'p2p') { const ci = $('#codeIn'); const c = clean(ci ? ci.value : S.code, 8).toUpperCase(); if (!c) { ci && ci.focus(); return; } S.code = c; LS.set('sc.code', c); }
  S.name = n; LS.set('sc.name', n); connectStudent(); S.view = null; renderStudent();
}
function onStudentClick(e) {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'pick') { S.pickT = +b.dataset.t; S.pickN++; S.choosing = false; S.view = null; sendState(); toast(`Joining ${TEAMS[S.pickT].emoji} ${TEAMS[S.pickT].name}…`, 1500); renderStudent(); }
  else if (a === 'roll') { if (S.rollReq) return; S.rollReq = [S.round, rid(6)]; S.view = null; sendState(); renderStudent(); }
  else if (a === 'repick') { S.choosing = true; S.view = null; renderStudent(); }
  else if (a === 'send') {
    const txt = clean(S.draft, 1500);
    if (wordCount(txt) < 8) { toast('Write a little more first.'); return; }
    if (wordCount(txt) < MIN_WORDS && !S.shortOk) { S.shortOk = true; toast(`Your text has ${wordCount(txt)} words. Try to write at least ${MIN_WORDS}. Tap Send again to send it anyway.`, 4000); return; }
    const m = el(`<div class="hintpop"><div class="scard"><div class="logo">📤</div><h2>Send your story?</h2><p class="muted" style="font-weight:700;margin:0">Your group can send only one text. You can't change it after this.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-x>Not yet</button><button class="btn green" data-ok>Send</button></div></div></div>`);
    document.body.appendChild(m);
    m.addEventListener('click', ev => { if (ev.target === m || ev.target.closest('[data-x]')) m.remove(); if (ev.target.closest('[data-ok]')) { S.sub = [rid(8), txt]; saveDraft(); sendState(); m.remove(); toast('Sending…'); } });
  }
}
let makeStudentT = null;
function connectStudent() { if (!S.T) { S.T = makeStudentT(S.code); S.T.subscribe(onPart); } sendState(); }
function startStudent(maker) {
  makeStudentT = maker;
  S.sid = LS.get('sc.sid', null); if (!S.sid) { S.sid = 's' + rid(9); LS.set('sc.sid', S.sid); }
  S.name = LS.get('sc.name', '');
  S.code = (params.get('room') || LS.get('sc.code', '') || '').toUpperCase();
  renderStudentShell();
  if (S.name && (MODE !== 'p2p' || (S.code && params.get('room')))) connectStudent();
  renderStudent();
  setInterval(() => { sTimer(); const L = S.live, t = myTeam(); if (S.T && S.name && ((S.sub && !(L && L.subs && L.subs[t])) || (S.rollReq && !(L && L.rolled && L.rolled[t])))) sendState(); }, 3000);
  setInterval(sTimer, 500);
}
function renderNoAccess() {
  document.body.className = 'student';
  $('#app').innerHTML = `<div class="landing"><div class="scard center"><div class="logo">🔒</div><h2>Can't connect to the game</h2><p class="muted" style="font-weight:800">Sign in to Claude with the e-mail your teacher invited, then open this link again.</p></div></div>`;
}

// ===================================================================
// BOOT
// ===================================================================
async function bootClaude() {
  $('#app').innerHTML = '<div class="landing"><div class="scard center"><div class="logo">🎲</div><h2>Loading Story Cubes…</h2><p class="small" id="bootMsg">checking who you are</p></div></div>';
  const user = await claude.use('user');
  let isOwner = false; try { isOwner = user ? !!(await user.isOwner()) : false; } catch (e) {}
  const role = (isOwner && location.hash !== '#play') ? 'host' : 'student';
  const [room, db] = await Promise.all([claude.use('room'), claude.use('db')]);
  if (role === 'host') { const sample = await claude.use('sample'); const live = !!(room && db); startHost(live ? () => claudeHostTransport(room, db) : null, { sample, demoOnly: !live }); }
  else { if (!room || !db) return renderNoAccess(); const T = claudeStudentTransport(room, db); startStudent(() => T); }
}
async function bootP2P() {
  if (params.get('local')) { MODE = 'local'; const mock = params.get('mockai') ? { json: async pr => { await sleep(1500); if (/"ok":true/.test(pr) && pr.length < 80) return { ok: true }; const ws = JSON.parse(pr.match(/TARGET WORDS: (\[.*?\])/)[1]); const story = pr.split('"""')[1]; return { words: ws.map((w, i) => ({ word: w, status: detect(w, story).used ? ['correct', 'form', 'meaning'][i % 3] : 'missing', used: (detect(w, story).hit || ''), note: i % 3 === 1 ? 'Use the noun form here.' : '' })), errors: [{ wrong: 'speaked', fix: 'spoke', type: 'tense' }, { wrong: 'the prohibit', fix: 'the prohibition', type: 'word form' }], error_count: 2, genre_fit: true, coherent: false, task_note: 'Good type, but the sentences are not connected.', praise: 'Great story, very clear and fun!' }; } } : null;
    return params.get('role') === 'student' ? startStudent(() => localStudentTransport()) : startHost(() => localHostTransport(), { sample: mock }); }
  try { await loadPeer(); } catch (e) { $('#app').innerHTML = '<div class="landing"><div class="scard center"><h2>Could not load the connection library.</h2><p class="muted">Check the internet connection and reload.</p></div></div>'; return; }
  const asStudent = params.has('room') || location.hash === '#join';
  const savedHost = LS.get('sc.host', null);
  const role = params.get('role') || (asStudent ? 'student' : (savedHost && savedHost.gid ? 'host' : null));
  if (role === 'host') return startHost(() => p2pHostTransport(() => G.code, c => { G.code = c; H.qrFor = null; H.view = null; markDirty(); }), {});
  if (role === 'student') return startStudent(code => p2pStudentTransport(code));
  $('#app').innerHTML = `<div class="landing"><div class="scard center"><div class="logo">🎲</div><h1>Story Cubes</h1><p class="muted" style="font-weight:800">Prep-C · Week 10 vocabulary</p>
    <button class="btn go big" id="goHost">🖥️ I'm the teacher: open the board</button><button class="btn big" id="goJoin">📱 Join a game</button></div></div>`;
  $('#goHost').onclick = () => { history.replaceState(null, '', '?role=host'); location.reload(); };
  $('#goJoin').onclick = () => { startStudent(code => p2pStudentTransport(code)); };
}
async function boot() {
  for (let i = 0; i < 10 && !(window.claude && typeof window.claude.use === 'function'); i++) await sleep(100);
  MODE = (window.claude && typeof window.claude.use === 'function') ? 'claude' : 'p2p';
  try { if (MODE === 'claude') await bootClaude(); else await bootP2P(); }
  catch (e) { console.error(e); $('#app').innerHTML = `<div class="landing"><div class="scard center"><h2>Something went wrong</h2><p class="muted">${esc(e && e.message)}</p></div></div>`; }
}
boot();

</script>
