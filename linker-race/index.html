<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linker Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{
  /* Board (projector): solid bar with clock, live scoreboard rows, feed of checked sentences. Phone: one item at a time with instant feedback. */
  --bg:#e7ebf3; --panel:#ffffff; --ink:#151936; --muted:#596080; --line:#d3d9e6; --hi:#ffcd2e;
  --ok:#12a150; --bad:#e5433b; --warn:#f5a524;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.015em;line-height:1.05}
.lab{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:.92rem}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:2.5px solid var(--ink);border-radius:12px;background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--hi)}
.btn.big{width:100%;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:14px 20px}
.btn.small{padding:6px 12px;font-size:.9rem;box-shadow:0 3px 0 var(--ink)}
.btn.sq{width:48px;height:48px;padding:0;font-size:1.4rem}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.card{background:var(--panel);border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.pill::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pill.ok::before{background:#3ddc84}.pill.err::before{background:#ff6b5e}
.phone .pill,.landing .pill{background:#fff;border:2px solid var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:700;cursor:pointer}
.seg button+button{border-left:2.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.fieldv{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mins{display:inline-flex;align-items:center;gap:12px}
.mins output{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.stripe{display:flex;gap:5px}
.stripe i{display:block;width:34px;height:9px;border-radius:3px}

/* Board */
.bar{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px clamp(14px,3vw,36px)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.015em}
.brand span{color:#b8bed8;font-size:.9rem}
.bar .btn{border-color:#fff;box-shadow:0 4px 0 rgba(255,255,255,.3)}
.bar .btn.small{box-shadow:0 3px 0 rgba(255,255,255,.3)}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,4.6vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink);border-radius:16px;padding:6px 20px;min-width:5ch;text-align:center}
.clock.paused{background:var(--hi)}
.clock.low{background:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.62}}

.lobby{display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr) minmax(260px,330px);gap:22px;padding:22px clamp(14px,3vw,36px) 40px;align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:1050px){.lobby{grid-template-columns:1fr 1fr}.groupsarea{grid-column:1/-1;order:3}}
@media (max-width:640px){.lobby{grid-template-columns:1fr}}
.joincard{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.joincard h2{font-size:1.5rem}
.qr{width:100%;max-width:250px;aspect-ratio:1;background:#fff;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:.9rem;padding:4px}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:var(--display);font-weight:800;font-size:3rem;letter-spacing:.14em;line-height:1}
.link{font-size:.78rem;word-break:break-all;background:var(--bg);border-radius:10px;padding:6px 10px;user-select:all;font-weight:700;max-width:100%}
.groupsarea{display:flex;flex-direction:column;gap:14px}
.groupsarea h2{font-size:2.1rem;display:flex;align-items:baseline;gap:12px}
.groupsarea h2 small{font-family:var(--body);font-size:1rem;color:var(--muted);font-weight:700;letter-spacing:0}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.gt{position:relative;background:var(--tc);color:var(--tt);border-radius:20px;padding:16px 18px;box-shadow:0 6px 0 rgba(21,25,54,.85);font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere;min-height:88px;display:flex;align-items:flex-end;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.gt.off{opacity:.45}
.gt .x{position:absolute;top:8px;right:8px;border:0;background:color-mix(in srgb,var(--tt) 20%,transparent);color:var(--tt);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.9rem}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.empty{border:2.5px dashed #b9c1d4;border-radius:20px;padding:28px;text-align:center;color:var(--muted);font-weight:700;margin:0}
.settings{display:flex;flex-direction:column;gap:16px}
.settings h2{font-size:1.5rem}

.race{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:22px;padding:22px clamp(14px,3vw,36px) 40px;max-width:1600px;margin:0 auto;align-items:start}
@media (max-width:980px){.race{grid-template-columns:1fr}}
.sb{position:relative}
.srow{position:absolute;left:0;right:0;display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--tc);color:var(--tt);border-radius:20px;padding:10px 22px;box-shadow:0 6px 0 rgba(21,25,54,.85);transition:top .6s cubic-bezier(.2,.8,.2,1)}
.srow .rk{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.srow .nm{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;overflow-wrap:anywhere}
.srow .pg{height:12px;border-radius:999px;background:color-mix(in srgb,var(--tt) 26%,transparent);overflow:hidden;margin-top:8px}
.srow .pg i{display:block;height:100%;width:0;background:var(--tt);border-radius:inherit;transition:width .4s ease}
.srow .sm{font-weight:700;font-size:.9rem;opacity:.85;margin-top:4px;font-variant-numeric:tabular-nums}
.srow .sc{font-family:var(--display);font-weight:800;font-size:3.3rem;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.srow .sc.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.3)}}
.feed{display:flex;flex-direction:column;gap:10px}
.feed h3{font-size:1.35rem}
#feed{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;border-radius:14px;padding:10px 12px;background:var(--bg);border-left:7px solid var(--tc)}
.chk.new{animation:slide .4s ease}
@keyframes slide{from{transform:translateX(16px);opacity:0}}
.chk .mk{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--ok)}
.chk.bad .mk{background:var(--bad)}
.chk .meta{font-size:.8rem;color:var(--muted);font-weight:700}
.chk .sent{font-size:1.02rem;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.chk .fbm{font-size:.85rem;color:var(--muted)}
.chk.bad .fbm{color:#a8281f}
.flip{border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:800;font-size:.78rem;padding:4px 8px;cursor:pointer;white-space:nowrap}
.flip:hover{border-color:var(--ink)}

.end{max-width:1300px;margin:0 auto;padding:26px clamp(14px,3vw,36px) 48px;display:flex;flex-direction:column;gap:20px}
.reason{margin:0;font-weight:700;font-size:1.15rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.winner{font-size:clamp(3rem,8vw,6rem);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
.winner span{background:var(--tc);color:var(--tt);padding:0 .16em;border-radius:.14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tie{margin:0;color:var(--muted);font-size:1.1rem}
.podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.podium li{display:grid;grid-template-columns:2.6rem minmax(150px,1.1fr) minmax(0,2fr) auto;align-items:center;gap:16px;background:var(--panel);border:2.5px solid var(--ink);border-radius:18px;padding:12px 18px;box-shadow:0 5px 0 var(--ink)}
.podium li.first{background:var(--tc);color:var(--tt)}
.place{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1}
.pname{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;overflow-wrap:anywhere}
.sw{flex:none;width:18px;height:18px;border-radius:5px;background:var(--tc)}
.first .sw{background:var(--tt)}
.pbar{height:18px;border-radius:999px;background:var(--bg);overflow:hidden}
.first .pbar{background:color-mix(in srgb,var(--tt) 25%,transparent)}
.pbar i{display:block;height:100%;width:var(--w);background:var(--tc);border-radius:inherit;animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * .09s)}
.first .pbar i{background:var(--tt)}
@keyframes grow{from{width:0}}
.pscore{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.pscore small{font-size:.5em;opacity:.65;margin-left:2px}
@media (max-width:640px){.podium li{grid-template-columns:2.2rem minmax(0,1fr) auto}.pbar{grid-column:1/-1;grid-row:2}}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.rv{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rvh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rvh .n{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:8px;background:var(--ink);color:#fff;font-size:.8rem;font-weight:700}
.rvh b{font-family:var(--display);font-weight:800;font-size:1.2rem}
.rvh .v{color:var(--muted)}
.rvs{display:flex;gap:8px;align-items:baseline;font-size:1rem}
.rvs .sw{width:12px;height:12px;border-radius:4px;transform:translateY(1px)}
.rvs.none{color:var(--muted);font-style:italic}

/* Phone */
.phone{max-width:560px;margin:0 auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.pcard{background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px}
.joinp{display:flex;flex-direction:column;gap:12px;margin-top:6vh}
.joinp h1{font-size:2.6rem}
.joinp form{display:flex;flex-direction:column;gap:8px}
.in{width:100%;border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.15rem;font-weight:700;background:#fff;outline:none}
.in:focus{border-color:var(--ink)}
.code-in{text-transform:uppercase;letter-spacing:.2em;font-family:var(--display);font-weight:800;font-size:1.6rem;text-align:center}
.gtbig{background:var(--tc);color:var(--tt);border-radius:22px;padding:22px 20px;box-shadow:0 6px 0 rgba(21,25,54,.85);font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.05;overflow-wrap:anywhere;min-height:110px;display:flex;align-items:flex-end}
.ptop{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--tc);color:var(--tt);border-radius:18px;padding:10px 12px 10px 16px;box-shadow:0 5px 0 rgba(21,25,54,.85)}
.ptop .nm{font-family:var(--display);font-weight:800;font-size:1.2rem;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.1}
.ptop .ps{font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.ptop .pt{font-family:var(--display);font-weight:800;font-size:1.3rem;background:#fff;color:var(--ink);border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums}
.ptop .pt.low{background:var(--bad);color:#fff}
.rankline{margin:0;font-weight:700;color:var(--muted);text-align:center}
.pausedb{background:var(--hi);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:42px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.cur{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.ok.cur{border-color:var(--ink)}
.chip.bad{background:#ffe1de;border-color:var(--bad);color:#a8281f}
.chip.wait{background:#fff3cd;border-color:var(--warn)}
.icard .inum{color:var(--muted);font-weight:700;font-size:.9rem}
.icard .ilk{font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1;margin-top:2px}
.icard .iv{font-size:1.35rem;font-weight:700;margin-top:6px}
.icard .sep{color:var(--muted)}
.icard textarea{min-height:120px;resize:vertical;line-height:1.35;margin:14px 0 12px;display:block}
.icard .done{margin:14px 0 12px;padding:12px 14px;border-radius:14px;background:#effaf3;border:2px solid var(--ok);font-weight:700;font-size:1.1rem}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:1.05rem;line-height:1.35}
.fb b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:2px}
.fb.ok{background:#dcfce7;color:#14532d}
.fb.bad{background:#ffe4e1;color:#8a1c12}
.fb.wait{background:#f1f3f8;color:var(--muted)}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* Shared bits */
.landing{max-width:560px;margin:0 auto;padding:10vh 16px 40px;display:flex;flex-direction:column;gap:14px}
.landing h1{font-size:3.2rem}
.landing ol{margin:0;padding-left:1.2em;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(21,25,54,.55);display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.mbox .qr{max-width:320px}
.mmsg{font-size:1.2rem;font-weight:700;margin:0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;max-width:92vw;text-align:center;animation:drop .3s}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:40;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="center muted" style="margin-top:20vh">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';
/* Linker Race — classroom game for a GitHub Pages site.
   Board (teacher) = host: keeps the game state and checks every sentence with grammar rules.
   Phones (one per group) join with a room code over PeerJS (WebRTC) and send their sentences. */

// ---------------- utils ----------------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const INVIS = new RegExp('[' + [[0, 0x1f], [0x7f, 0x9f], [0x200b, 0x200f], [0x2028, 0x202e], [0x2060, 0x206f], [0xfeff, 0xfeff]].map(r => r.map(c => '\\u' + c.toString(16).padStart(4, '0')).join('-')).join('') + ']', 'g');
const clean = (s, max = 200) => String(s ?? '').replace(INVIS, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
const ALPH = 'abcdefghijkmnpqrstuvwxyz23456789';
const rid = (n = 8) => { const a = crypto.getRandomValues(new Uint8Array(n)); let s = ''; for (const x of a) s += ALPH[x % ALPH.length]; return s; };
const CODE_ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode = () => { const a = crypto.getRandomValues(new Uint8Array(5)); let s = ''; for (const x of a) s += CODE_ALPH[x % CODE_ALPH.length]; return s; };
const now = () => Date.now();
const fmt = ms => { const s = Math.ceil(Math.max(0, ms) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const ord = n => n + ((n % 100 > 10 && n % 100 < 14) ? 'th' : (['th', 'st', 'nd', 'rd'][n % 10] || 'th'));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const params = new URLSearchParams(location.search);
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function toast(msg, ms = 2600) { const t = el(`<div class="toast">${esc(msg)}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function modal(html) { const m = el(`<div class="modal"><div class="mbox">${html}</div></div>`); document.body.appendChild(m); m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }); return m; }
function confirmBox(msg, fn, yes) { const m = modal(`<p class="mmsg">${esc(msg)}</p><div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${esc(yes)}</button></div>`); m.querySelector('[data-ok]').onclick = () => { m.remove(); fn(); }; }
function confetti(n = 90) { const cs = ['#e5433b', '#1d6ee6', '#10a067', '#f7b21b', '#7a4de0', '#e0418a', '#0e9bab', '#f06a28']; for (let i = 0; i < n; i++) { const c = el('<i class="confetti"></i>'); c.style.left = Math.random() * 100 + 'vw'; c.style.background = cs[i % cs.length]; c.style.animationDuration = 2.2 + Math.random() * 2.2 + 's'; c.style.animationDelay = Math.random() * .8 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 5500); } }
function shake(node) { if (!node) return; node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake'); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const PILL = {};
function setPill(id, state, text) { PILL[id] = [state, text]; applyPill(id); }
function applyPill(id) { const p = document.getElementById(id), v = PILL[id]; if (!p || !v) return; p.className = 'pill ' + (v[0] === 'online' ? 'ok' : v[0] === 'offline' ? 'err' : ''); p.textContent = v[1]; p.hidden = false; }

const sItems = () => S.live ? setItemsOf(S.live.set) : [];
function nextOpen(from) {
  const its = sItems(); if (!its.length) return null;
  const i0 = Math.max(0, its.findIndex(i => i.n === from));
  for (let k = 1; k <= its.length; k++) { const it = its[(i0 + k) % its.length]; if (status(it.n) === '' || status(it.n) === 'bad') return it.n; }
  for (let k = 1; k <= its.length; k++) { const it = its[(i0 + k) % its.length]; if (status(it.n) !== 'ok') return it.n; }
  return null;
}
function sView() {
  if (!S.name || !S.T) return 'join';
  if (!S.live || !meRow()) return 'connecting';
  return S.live.phase === 'race' ? 'race' : S.live.phase === 'end' ? 'end' : 'wait';
}
function onPart(part, d) {
  if (part !== 'live' || !d || typeof d !== 'object') return;
  if (d.gid !== S.gid) { S.gid = d.gid; S.att = []; S.drafts = {}; S.cur = null; S.okSeen = {}; S.badSeen = ''; S.cheered = false; sSave(); sendState(); }
  S.live = d; S.endsLocal = now() + (d.left || 0);
  if (d.phase === 'race') {
    const its = sItems();
    if (!S.cur || !its.some(i => i.n === S.cur)) { S.cur = (its.find(i => status(i.n) !== 'ok') || its[0] || {}).n || null; }
    if (S.cur) {
      const st = status(S.cur), r = myRes(S.cur);
      if (st === 'ok' && !S.okSeen[S.cur]) { const from = S.cur; clearTimeout(S.adv); S.adv = setTimeout(() => { if (S.cur === from && status(from) === 'ok') { const nx = nextOpen(from); if (nx) { S.cur = nx; sSave(); renderStudent(); } } }, 1600); }
      if (st === 'bad' && r && S.badSeen !== r[3]) { S.badSeen = r[3]; S.needShake = true; }
    }
    for (const it of its) if (status(it.n) === 'ok') S.okSeen[it.n] = 1;
  }
  renderStudent();
}
function sBuild(v) {
  const me = meRow(), style = me ? colorOf(me[1]) : '';
  if (v === 'join') {
    const needCode = !params.get('room');
    return `<div class="phone"><div class="pcard joinp"><div class="stripe" aria-hidden="true">${COLORS.map(c => `<i style="background:${c[0]}"></i>`).join('')}</div><h1>Linker Race</h1><p class="hint">One phone per group. Type your group name to join.</p>
      <form id="joinF">${needCode ? `<label class="lab" for="codeIn">Room code</label><input class="in code-in" id="codeIn" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" value="${esc(S.code)}">` : ''}
      <label class="lab" for="nameIn">Group name</label><input class="in" id="nameIn" maxlength="18" autocomplete="off" spellcheck="false" placeholder="e.g. The Linkers" value="${esc(S.name || LS.get('lr.name', ''))}">
      <button class="btn primary big" type="submit">Join the race</button></form></div></div>`;
  }
  if (v === 'connecting') return `<div class="phone"><div class="pcard center joinp"><h2><span class="spin"></span>Connecting…</h2><p class="hint">Room ${esc(S.code)}</p><div><span class="pill" id="sConn"></span></div><button class="btn small" data-act="rejoin">Change room code or name</button></div></div>`;
  if (v === 'wait') return `<div class="phone" style="${style}"><div class="gtbig" id="gname"></div><div class="pcard center"><h2>You're in!</h2><p class="hint" style="margin-top:6px">Waiting for the teacher to start the race…</p><p style="margin:12px 0 0"><button class="btn small" data-act="rename">Change group name</button></p></div><div class="center"><span class="pill" id="sConn"></span></div></div>`;
  if (v === 'race') return `<div class="phone" style="${style}">
      <header class="ptop"><span class="nm" id="pnm"></span><span class="ps" id="ps"></span><span class="pt" id="pt"></span></header>
      <p class="rankline" id="rankline"></p><div class="pausedb" id="pausedb" hidden>Paused by the teacher</div>
      <div class="strip" id="strip"></div><section class="pcard icard" id="icard"></section>
      <div class="center"><span class="pill" id="sConn"></span></div></div>`;
  return `<div class="phone" style="${style}"><div class="gtbig" id="gname"></div><div class="pcard center"><span class="lab">Race over</span><h1 id="erank" style="font-size:2.6rem;margin-top:6px"></h1><p id="escore" style="font-weight:700;font-size:1.2rem;margin:8px 0 0"></p><p class="hint" id="ewin" style="margin-top:6px"></p></div></div>`;
}
function icardHTML() {
  const it = IT[S.cur]; if (!it) return '<p class="hint">No items.</p>';
  const st = status(it.n), r = myRes(it.n), paused = S.live.paused;
  let fb = '';
  if (st === 'ok') fb = `<div class="fb ok"><b>✓ ${r && r[1] === 'Teacher' ? 'Accepted' : 'Correct!'} +1</b>${esc(r ? r[2] : '')}</div>`;
  else if (st === 'wait') fb = '<div class="fb wait"><span class="spin"></span>Checking…</div>';
  else if (st === 'bad' && r) fb = `<div class="fb bad"><b>✗ ${esc(r[1])}</b>${esc(r[2])}</div>`;
  const acc = st === 'ok' && r ? (S.att.find(a => a[0] === r[3]) || [])[2] : '';
  const body = st === 'ok'
    ? `<div class="done">${esc(acc || 'Solved.')}</div><button class="btn primary big" data-act="nextItem">Next item →</button>`
    : `<label class="lab" for="sIn" hidden>Your sentence</label><textarea class="in" id="sIn" rows="4" maxlength="300" placeholder="One sentence with “${esc(it.l)}”, “${esc(it.a)}” and “${esc(it.b)}”." ${st === 'wait' || paused ? 'disabled' : ''}></textarea><button class="btn primary big" data-act="send" ${st === 'wait' || paused ? 'disabled' : ''}>Send</button>`;
  return `<div class="inum">Item ${it.n}</div><div class="ilk">${esc(it.l)}</div><div class="iv">${esc(it.a)} <span class="sep">/</span> ${esc(it.b)}</div>${body}${fb}`;
}
function sUpdate(v) {
  const me = meRow(), L = S.live;
  if (v === 'wait' || v === 'end') { const g = $('#gname'); if (g) g.textContent = S.name; }
  if (v === 'race') {
    const tot = L.total || sItems().length, sc = me ? me[2] : 0, rk = (L.rank || []).indexOf(S.sid) + 1;
    $('#pnm').textContent = S.name; $('#ps').textContent = `${sc}/${tot}`;
    $('#rankline').textContent = rk && sc > 0 ? `You're ${ord(rk)} of ${L.rank.length} groups` : `${L.rank.length} groups in the race`;
    $('#pausedb').hidden = !L.paused;
    $('#strip').innerHTML = sItems().map(it => { const st = status(it.n); return `<button class="chip ${st}${it.n === S.cur ? ' cur' : ''}" data-act="item" data-n="${it.n}" aria-label="Item ${it.n}${st === 'ok' ? ', solved' : ''}">${st === 'ok' ? '✓' : it.n}</button>`; }).join('');
    const sig = [S.cur, status(S.cur), (myRes(S.cur) || [])[3] || '', L.paused].join('|');
    if (sig !== S.sig) {
      const ta = $('#sIn'), hadFocus = ta && document.activeElement === ta;
      S.sig = sig; const card = $('#icard'); card.innerHTML = icardHTML();
      const nt = $('#sIn');
      if (nt) { nt.value = S.drafts[S.cur] || ''; if (hadFocus && !nt.disabled) nt.focus(); }
      if (S.needShake) { S.needShake = false; shake(card); }
    }
    sTimer();
  }
  if (v === 'end') {
    const rk = (L.rank || []).indexOf(S.sid) + 1, tot = L.total, sc = me ? me[2] : 0, w = L.rank && L.rank[0] && L.roster[L.rank[0]];
    $('#erank').textContent = rk ? `${ord(rk)} place` : 'Race over';
    $('#escore').textContent = `${sc} of ${tot} sentences correct`;
    $('#ewin').textContent = w && w[2] > 0 ? (L.rank[0] === S.sid ? 'Your group won! 🎉' : `Winner: ${w[0]}`) : '';
    if (rk === 1 && sc > 0 && !S.cheered) { S.cheered = true; confetti(); }
  }
}
function renderStudent() {
  const v = sView();
  if (v !== S.view) {
    S.view = v; S.sig = '';
    $('#app').innerHTML = sBuild(v); applyPill('sConn');
    if (v === 'join') { const f = $('#codeIn') && !$('#codeIn').value ? $('#codeIn') : $('#nameIn'); if (f) f.focus(); }
  }
  if (v !== 'join' && v !== 'connecting') sUpdate(v);
}
function sTimer() {
  const p = $('#pt'); if (!p || !S.live) return;
  const ms = S.live.paused ? S.live.left : S.endsLocal - now();
  p.textContent = fmt(ms); p.classList.toggle('low', !S.live.paused && ms <= 60000);
}
function sendItem() {
  const ta = $('#sIn'); if (!ta || !S.cur) return;
  const t = clean(ta.value, 300);
  if (t.split(' ').length < 3) { shake($('#icard')); toast('Write a full sentence first.'); return; }
  S.drafts[S.cur] = ta.value;
  S.att.push(['a' + rid(8), S.cur, t]); if (S.att.length > 40) S.att = S.att.slice(-40);
  sSave(); sendState(); renderStudent();
}
function onStudentClick(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'send') sendItem();
  else if (a === 'item') { S.cur = +b.dataset.n; sSave(); renderStudent(); }
  else if (a === 'nextItem') { const nx = nextOpen(S.cur); if (nx) { S.cur = nx; sSave(); renderStudent(); } else toast('All items are solved. Well done!'); }
  else if (a === 'rename') { S.name = ''; S.view = null; renderStudent(); }
  else if (a === 'rejoin') { LS.del('lr.code'); const u = new URL(location.href); u.searchParams.delete('room'); u.hash = 'join'; location.href = u.toString(); }
}
function onStudentSubmit(e) {
  if (e.target.id !== 'joinF') return;
  e.preventDefault();
  const ci = $('#codeIn'); const code = (ci ? ci.value : S.code).replace(/\s/g, '').toUpperCase();
  const name = clean($('#nameIn').value, 18);
  if (code.length !== 5) { toast('Type the 5-character room code from the board.'); return; }
  if (!name) { toast('Type your group name.'); $('#nameIn').focus(); return; }
  if (S.T && code !== S.code) { LS.set('lr.code', code); LS.set('lr.name', name); const u = new URL(location.href); u.searchParams.set('room', code); location.href = u.toString(); return; }
  S.name = name; S.code = code; LS.set('lr.name', name); LS.set('lr.code', code);
  if (!S.T) { S.T = p2pStudentTransport(code); S.T.subscribe(onPart); }
  sendState(); renderStudent();
}
function onStudentInput(e) { if (e.target.id === 'sIn' && S.cur) S.drafts[S.cur] = e.target.value; }
function onStudentKey(e) { if (e.target.id === 'sIn' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendItem(); } }
function startStudent() {
  document.body.className = 'student';
  S.sid = LS.get('lr.sid', null); if (!S.sid) { S.sid = 's' + rid(9); LS.set('lr.sid', S.sid); }
  const savedCode = LS.get('lr.code', '');
  S.code = (params.get('room') || savedCode || '').toUpperCase();
  const ss = LS.get('lr.s', null);
  const resume = !!(LS.get('lr.name', '') && S.code && S.code === savedCode);
  if (resume) { S.name = LS.get('lr.name', ''); if (ss) { S.gid = ss.gid; S.att = ss.att || []; S.cur = ss.cur || null; } }
  document.addEventListener('click', onStudentClick);
  document.addEventListener('submit', onStudentSubmit);
  document.addEventListener('input', onStudentInput);
  document.addEventListener('keydown', onStudentKey);
  if (resume) { S.T = p2pStudentTransport(S.code); S.T.subscribe(onPart); sendState(); }
  renderStudent();
  setInterval(sTimer, 500);
}

// ===================================================================
// BOOT
// ===================================================================
function landing() {
  $('#app').innerHTML = `<div class="landing"><div class="stripe" aria-hidden="true">${COLORS.map(c => `<i style="background:${c[0]}"></i>`).join('')}</div><h1>Linker Race</h1>
    <p class="hint" style="font-size:1.05rem">Groups write one sentence for each linker and two verbs. Every sentence is checked at once, and the scoreboard updates live.</p>
    <button class="btn primary big" id="goHost">I'm the teacher: open the board</button><button class="btn big" id="goJoin">Join a game</button>
    <ol><li>Open the board on the classroom computer.</li><li>Each group scans the QR code with one phone and types a group name.</li><li>Press Start. The race ends when time runs out or a group gets every sentence right.</li></ol></div>`;
  $('#goHost').onclick = () => { const u = new URL(location.href); u.searchParams.set('role', 'host'); location.href = u.toString(); };
  $('#goJoin').onclick = () => startStudent();
}
async function boot() {
  try { await loadPeer(); }
  catch (e) { $('#app').innerHTML = '<div class="landing"><div class="pcard center"><h2>Could not load the connection library.</h2><p class="hint" style="margin-top:8px">Check the internet connection and reload the page.</p></div></div>'; return; }
  const asStudent = params.has('room') || location.hash === '#join';
  const saved = LS.get('lr.host', null);
  const role = params.get('role') || (asStudent ? 'student' : (saved && saved.gid ? 'host' : null));
  if (role === 'host') return startHost();
  if (role === 'student') return startStudent();
  landing();
}
boot();
</script>
</body>
</html>
