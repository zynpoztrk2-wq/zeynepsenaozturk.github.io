<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@500;600;700&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one deck of 36 colour cards on a quiet ground (header, instruction + progress, wrapping grid).
   Choosing a card opens it large in a dialog; the card flips to a ~1-minute sample answer. */
:root{
  --bg:#F5F4F9;
  --surface:#FFFFFF;
  --soft:#E9E7F1;
  --ink:#1E1B2E;
  --muted:#686480;
  --line:#DCD9E8;
  --card-ink:#1E1B2E;
  --paper:rgba(255,255,255,.72);
  --accent:#5B3FD6; --accent-ink:#FFFFFF;
  --k0:#FF8A6B; --k1:#FFC34D; --k2:#3FC4A9; --k3:#6AA6FF; --k4:#A98BF5; --k5:#F27DAE;
  --good:#1D8A55;
  --shadow:rgba(30,27,46,.18);
  --qr-bg:#FFFFFF;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121D; --surface:#211E2E; --soft:#2B2840; --ink:#F2F0FA; --muted:#A9A5C2; --line:#353149;
    --accent:#A893FF; --accent-ink:#17122E; --good:#5FD69A; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121D; --surface:#211E2E; --soft:#2B2840; --ink:#F2F0FA; --muted:#A9A5C2; --line:#353149;
  --accent:#A893FF; --accent-ink:#17122E; --good:#5FD69A; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html, body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; overflow:hidden}
/* App shell: header stays put, the deck scrolls inside its own box, so the page also works in a fixed-size embed (e.g. Canva). */
.wrap{
  height:100%; max-width:1240px; margin:0 auto;
  padding-inline:clamp(16px,3vw,40px);
  padding-block:clamp(14px,2.2vw,28px) 0;
  display:flex; flex-direction:column; gap:clamp(12px,1.6vw,20px);
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

.k0{--c:var(--k0)} .k1{--c:var(--k1)} .k2{--c:var(--k2)}
.k3{--c:var(--k3)} .k4{--c:var(--k4)} .k5{--c:var(--k5)}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px 16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.mark{display:flex; gap:4px; flex:none}
.mark i{width:12px; height:28px; border-radius:6px}
.mark i:nth-child(1){background:var(--k0)} .mark i:nth-child(2){background:var(--k1); height:20px; align-self:flex-end}
.mark i:nth-child(3){background:var(--k3); height:34px; margin-top:-6px}
h1{
  font-family:var(--font-display); font-weight:800; font-optical-sizing:auto;
  font-size:clamp(1.9rem,3.4vw,2.9rem); line-height:1.05; margin:0; letter-spacing:-.02em; text-wrap:balance;
}
.tools{display:flex; gap:8px; flex-wrap:wrap}
.tool{
  font:600 .92rem var(--font-body); color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:999px;
  padding:6px 16px; min-height:42px; min-width:42px; cursor:pointer;
}
.tool:hover{border-color:var(--muted)}
.tool.hot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

.row{display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:space-between}
.top, .row{flex:none}
.instr{margin:0; color:var(--muted); font-size:calc(clamp(1rem,1.4vw,1.15rem)*var(--scale)); max-width:75ch}
.progress{
  font:600 .9rem var(--font-body); font-variant-numeric:tabular-nums; color:var(--muted);
  display:flex; align-items:center; gap:10px; white-space:nowrap;
}
.meter{width:120px; height:8px; border-radius:99px; background:var(--soft); overflow:hidden}
.meter i{display:block; height:100%; width:var(--w,0%); background:var(--good); border-radius:99px; transition:width .3s}

/* deck */
.deck{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,212px),1fr));
  gap:clamp(14px,1.6vw,20px);
  align-content:start; flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:8px 8px 24px; margin-inline:-8px;
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
.pick{
  display:flex; flex-direction:column; gap:12px; text-align:left; min-width:0;
  padding:16px 16px 18px; border:0; border-radius:20px;
  background:var(--c); color:var(--card-ink); cursor:pointer;
  box-shadow:0 1px 2px var(--shadow), 0 14px 24px -18px var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease;
}
.pick:hover{transform:translateY(-3px); box-shadow:0 2px 4px var(--shadow), 0 20px 30px -18px var(--shadow)}
.pick:active{transform:translateY(0)}
.pick .head{display:flex; align-items:center; justify-content:space-between; gap:8px}
.pick .no{font:800 1.9rem/1 var(--font-display); letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.pick .emo{
  display:grid; place-items:center; width:38px; height:38px; border-radius:50%;
  background:var(--paper); font-size:1.2rem; line-height:1; font-family:var(--emoji);
}
.pick .pq{font:600 calc(clamp(.96rem,1.2vw,1.06rem)*var(--scale))/1.4 var(--font-body); overflow-wrap:anywhere}
.stamp{
  display:none; align-self:flex-start; margin-top:auto;
  font:700 .76rem var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--good);
}
.pick.done{background:var(--soft); color:var(--muted); box-shadow:none}
.pick.done .emo{background:var(--surface); filter:grayscale(1); opacity:.6}
.pick.done .stamp{display:block}

/* open card */
dialog{
  border:0; padding:0; background:transparent; color:var(--ink);
  width:min(960px, calc(100% - 24px)); max-width:none;
  max-height:calc(100% - 24px); overflow:visible;
}
dialog::backdrop{background:rgba(16,13,30,.6); backdrop-filter:blur(3px)}
.sheet{
  display:flex; flex-direction:column; gap:18px;
  max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px);
  overflow-y:auto; padding:4px 4px 14px;
}
.flip{perspective:1800px}
.inner{display:grid; transform-style:preserve-3d; transition:transform .65s cubic-bezier(.45,.05,.2,1)}
.inner.flipped{transform:rotateY(180deg)}
.face{
  grid-area:1/1; -webkit-backface-visibility:hidden; backface-visibility:hidden;
  border-radius:28px; box-shadow:0 30px 60px -30px rgba(0,0,0,.55);
  padding:clamp(22px,3.8vw,48px); display:flex; flex-direction:column; gap:clamp(14px,2vw,22px); min-width:0;
}
.front{background:var(--c); color:var(--card-ink)}
.back{background:var(--surface); color:var(--ink); transform:rotateY(180deg); border-top:10px solid var(--c)}
.fhead{display:flex; align-items:center; justify-content:space-between; gap:12px}
.chip{font:700 .82rem var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--card-ink); opacity:.75}
.bigemo{
  display:grid; place-items:center; width:64px; height:64px; border-radius:50%; flex:none;
  background:var(--paper); font-size:2rem; line-height:1; font-family:var(--emoji);
}
.bigq{
  margin:0; font:700 calc(clamp(1.7rem,3.6vw,2.9rem)*var(--scale))/1.15 var(--font-display);
  letter-spacing:-.015em; text-wrap:balance; overflow-wrap:anywhere;
}
.follow{
  background:var(--paper); color:var(--card-ink); border-radius:18px;
  padding:clamp(14px,2vw,22px); display:flex; flex-direction:column; gap:6px;
}
.lbl{font:700 .78rem var(--font-body); letter-spacing:.08em; text-transform:uppercase}
.follow .lbl{opacity:.65}
.follow p{margin:0; font:600 calc(clamp(1.1rem,2vw,1.55rem)*var(--scale))/1.35 var(--font-body)}
.backhead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 16px}
.backhead .lbl{color:var(--good)}
.backhead .meta{font:500 .88rem var(--font-body); color:var(--muted); font-variant-numeric:tabular-nums}
.backq{margin:0; color:var(--muted); font-size:calc(clamp(.98rem,1.4vw,1.12rem)*var(--scale)); font-weight:600}
.answer{display:flex; flex-direction:column; gap:.8em; max-width:75ch}
.answer p{margin:0; font-weight:500; font-size:calc(clamp(1.06rem,1.75vw,1.42rem)*var(--scale)); line-height:1.6; text-wrap:pretty}

.bar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.btn{
  font:700 calc(clamp(1rem,1.45vw,1.15rem)*var(--scale))/1 var(--font-body);
  border-radius:16px; padding:.8em 1.25em; min-height:54px; cursor:pointer;
  border:0; background:var(--surface); color:var(--ink);
  box-shadow:0 10px 24px -14px rgba(0,0,0,.5); transition:transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.main{flex:0 1 360px; background:var(--accent); color:var(--accent-ink)}
.timer{
  font-variant-numeric:tabular-nums; min-width:9.5em; color:var(--card-ink);
  background:linear-gradient(to right, var(--k1) calc(var(--p,1)*100%), #FFF3D6 0);
}
.timer.up{background:var(--k0)}
@media (max-width:600px){
  .btn.main{order:-1; flex-basis:100%}
  .bar .btn:not(.main){flex:1}
}

/* QR panel */
#qrDlg{width:min(500px, calc(100% - 24px))}
.qrpanel{
  background:var(--surface); color:var(--ink); border-radius:28px;
  padding:clamp(20px,3.4vw,36px); display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.55);
  max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); overflow-y:auto;
}
.qrpanel h2{margin:0; font:800 clamp(1.4rem,3vw,2rem)/1.15 var(--font-display); letter-spacing:-.015em; text-wrap:balance}
.qrpanel .sub{margin:0; color:var(--muted); font-size:1rem}
.qrbox{width:min(340px, 62vmin, 100%); padding:14px; border-radius:20px; background:var(--qr-bg); border:4px solid var(--k3)}
.qrbox svg{display:block; width:100%; height:auto}
.qrurl{
  margin:0; font:600 .9rem var(--font-body); color:var(--muted); overflow-wrap:anywhere;
  -webkit-user-select:all; user-select:all;
}
.qrbtns{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%}
.qrbtns .btn{flex:1 1 160px; box-shadow:none; border:1.5px solid var(--line)}
.qrbtns .btn.main{border-color:var(--accent)}
.tool.qr-open{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* Short frames (embeds, small laptop screens): tighter chrome so more cards show */
@media (max-height:700px){
  .wrap{padding-block:10px 0; gap:8px}
  h1{font-size:clamp(1.4rem,3vw,2rem)}
  .mark{transform:scale(.72); transform-origin:left center; margin-right:-8px}
  .tool{min-height:34px; padding:3px 12px; font-size:.82rem}
  .instr{font-size:.9rem}
  .pick{padding:12px 12px 14px; gap:8px; border-radius:16px}
  .pick .no{font-size:1.5rem}
  .pick .emo{width:32px; height:32px; font-size:1rem}
  .face{padding:18px 24px; gap:12px; border-radius:22px}
  .bigemo{width:48px; height:48px; font-size:1.5rem}
  .follow{padding:12px 16px}
  .btn{min-height:44px; padding:.6em 1em}
  .sheet{gap:12px}
}

@media (prefers-reduced-motion:reduce){
  .inner, .pick, .btn, .meter i{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Speaking Cards</h1>
    </div>
    <div class="tools">
      <button class="tool qr-open" id="qrBtn" type="button">QR code</button>
      <button class="tool" id="random" type="button">Random card</button>
      <button class="tool" id="reset" type="button">Reset</button>
      <button class="tool" id="smaller" type="button" aria-label="Smaller text">A−</button>
      <button class="tool" id="bigger" type="button" aria-label="Larger text">A+</button>
      <button class="tool" id="fs" type="button">Full screen</button>
    </div>
  </header>

  <div class="row">
    <p class="instr">Choose a card and speak for about one minute. Answer both questions, then flip the card to see a sample answer.</p>
    <span class="progress"><span class="meter"><i id="meter"></i></span><span id="progress"></span></span>
  </div>

  <main class="deck" id="deck" aria-label="Speaking cards"></main>
</div>

<dialog id="dlg" aria-label="Speaking card">
  <div class="sheet">
    <div class="flip">
      <div class="inner" id="inner">
        <section class="face front" id="front"></section>
        <section class="face back" id="back" aria-hidden="true"></section>
      </div>
    </div>
    <div class="bar">
      <button class="btn" id="close" type="button">← All cards</button>
      <button class="btn timer" id="timer" type="button">Start 1:00</button>
      <button class="btn main" id="flipBtn" type="button" autofocus>Show sample answer</button>
    </div>
  </div>
</dialog>

<dialog id="qrDlg" aria-label="QR code">
  <div class="qrpanel">
    <h2>Scan to open the cards</h2>

<script>
const CARDS = [
  {q:"What kind of person are you in your daily life: organised or spontaneous?",
   f:["Can you give an example from a recent experience?"],
   a:["I think I am an organised person in my daily life. I usually plan my day the night before. I write my lessons, homework and other plans in a small notebook. This helps me a lot because I don't forget important things.",
      "For example, last week I had two quizzes and a presentation. I made a simple plan for every day. On Monday and Tuesday, I studied for the quizzes, and on Wednesday, I prepared my slides. Because of this plan, I didn't feel stressed, and I got good grades. But I am not organised all the time. Last Saturday, my friends called me in the morning, and we suddenly decided to go to the seaside. It was a lovely day! So, I am organised on weekdays and a little spontaneous at weekends."]},
  {q:"Do you think your daily routine has changed in the last few years?",
   f:["What did you use to do differently?"],
   a:["Yes, I think my daily routine has changed a lot in the last few years. When I was in high school, I used to get up very early, at about half past six, because my school was far from my house. I used to spend all day at school, and in the evening I studied for the university exam. I didn't have much free time.",

const EMOJI = ["🗓️","⏰","🌟","🧭","⏳","🤝","📸","🎤","📍","🦋",
               "🎯","🏆","💪","🧗","🌱","🔁","📱","📵","🤳","🛍️",
               "💸","🪞","👕","🏡","🗺️","💡","✈️","🎒","🏫","🍎",
               "📚","💼","🔀","⚖️","🌈","🔑"];
const NCOL = 6;
const SCALES = [.88, 1, 1.15, 1.3, 1.45];
const TIME = 60;

const state = { done:new Set(), scale:1 };
try{
  const s = JSON.parse(localStorage.getItem("spk-state-v2") || "null");
  if(s){
    if(Array.isArray(s.done)) state.done = new Set(s.done.filter(i => Number.isInteger(i) && i >= 0 && i < CARDS.length));
    if(SCALES.includes(s.scale)) state.scale = s.scale;
  }
}catch(e){}
function save(){
  try{ localStorage.setItem("spk-state-v2", JSON.stringify({done:[...state.done], scale:state.scale})); }catch(e){}
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const $ = id => document.getElementById(id);
const deck = $("deck"), dlg = $("dlg"), inner = $("inner"), front = $("front"), back = $("back");
const flipBtn = $("flipBtn"), timerBtn = $("timer");

/* deck */
function renderDeck(){
  deck.innerHTML = CARDS.map((c,i) => `
    <button class="pick k${i%NCOL}${state.done.has(i) ? " done" : ""}" type="button" data-i="${i}" aria-label="Card ${i+1}: ${esc(c.q)}">
      <span class="head"><span class="no">${pad(i+1)}</span><span class="emo" aria-hidden="true">${EMOJI[i]}</span></span>
      <span class="pq">${esc(c.q)}</span>
      <span class="stamp">✓ Done</span>
    </button>`).join("");
  $("progress").textContent = `${state.done.size} of ${CARDS.length} done`;
  $("meter").style.setProperty("--w", `${state.done.size / CARDS.length * 100}%`);
}
deck.addEventListener("click", e => {
  const b = e.target.closest(".pick"); if(b) openCard(+b.dataset.i);
});

/* open card */
let flipped = false;
function openCard(i){
  const c = CARDS[i], col = `k${i%NCOL}`;
  const words = c.a.join(" ").split(/\s+/).length;
  front.className = `face front ${col}`;
  back.className = `face back ${col}`;
  front.innerHTML = `
    <div class="fhead"><span class="chip">Card ${pad(i+1)} / ${CARDS.length}</span><span class="bigemo" aria-hidden="true">${EMOJI[i]}</span></div>
    <h2 class="bigq">${esc(c.q)}</h2>
    <div class="follow"><span class="lbl">Follow-up</span>${c.f.map(f => `<p>${esc(f)}</p>`).join("")}</div>`;
  back.innerHTML = `
    <div class="backhead"><span class="lbl">Sample answer</span><span class="meta">${words} words · about 1 minute</span></div>
    <p class="backq">${esc(c.q)}</p>
    <div class="answer">${c.a.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
  setFlip(false, true);
  resetTimer();
  state.done.add(i);
  save();
  if(!dlg.open) dlg.showModal();
  flipBtn.focus();
  dlg.querySelector(".sheet").scrollTop = 0;
}
function setFlip(v, instant){
  flipped = v;
  if(instant){ inner.style.transition = "none"; }
  inner.classList.toggle("flipped", v);
  if(instant){ void inner.offsetWidth; inner.style.transition = ""; }
  front.setAttribute("aria-hidden", v ? "true" : "false");
  back.setAttribute("aria-hidden", v ? "false" : "true");
  flipBtn.textContent = v ? "Back to question" : "Show sample answer";
}
flipBtn.addEventListener("click", () => setFlip(!flipped));
$("close").addEventListener("click", () => dlg.close());
dlg.addEventListener("close", () => { stopTimer(); renderDeck(); });
dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });

/* one-minute timer */
let left = TIME, tick = null, endAt = 0;
function fmt(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function paintTimer(){
  const secs = Math.ceil(left);
  timerBtn.style.setProperty("--p", Math.max(0, left / TIME));
  timerBtn.classList.toggle("up", left <= 0);
  timerBtn.textContent = left <= 0 ? "Time’s up · Again"
    : tick ? `Pause ${fmt(secs)}`
    : left < TIME ? `Resume ${fmt(secs)}` : "Start 1:00";
}
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }
function resetTimer(){ stopTimer(); left = TIME; paintTimer(); }
timerBtn.addEventListener("click", () => {
  if(left <= 0){ resetTimer(); }
  if(tick){ left = Math.max(0, (endAt - Date.now()) / 1000); stopTimer(); paintTimer(); return; }
  endAt = Date.now() + left * 1000;
  tick = setInterval(() => {
    left = Math.max(0, (endAt - Date.now()) / 1000);
    if(left <= 0) stopTimer();
    paintTimer();
  }, 200);
  paintTimer();
});

/* tools */
$("random").addEventListener("click", () => {
  const all = [...CARDS.keys()];
  const pool = all.filter(i => !state.done.has(i));
  const from = pool.length ? pool : all;
  openCard(from[Math.floor(Math.random() * from.length)]);
});
let resetArmed = null;
const resetBtn = $("reset");
function disarm(){ resetArmed = null; resetBtn.textContent = "Reset"; resetBtn.classList.remove("hot"); }
resetBtn.addEventListener("click", () => {
  if(resetArmed){ clearTimeout(resetArmed); disarm(); state.done.clear(); save(); renderDeck(); return; }
  resetBtn.textContent = "Tap again to clear"; resetBtn.classList.add("hot");
  resetArmed = setTimeout(disarm, 3000);
});
function applyScale(){ document.documentElement.style.setProperty("--scale", state.scale); }
$("smaller").addEventListener("click", () => { state.scale = SCALES[Math.max(0, SCALES.indexOf(state.scale) - 1)]; applyScale(); save(); });
$("bigger").addEventListener("click", () => { state.scale = SCALES[Math.min(SCALES.length - 1, SCALES.indexOf(state.scale) + 1)]; applyScale(); save(); });

const fsBtn = $("fs");
if(!document.fullscreenEnabled || !document.documentElement.requestFullscreen){ fsBtn.hidden = true; }
fsBtn.addEventListener("click", () => {
  if(document.fullscreenElement){ document.exitFullscreen().catch(() => {}); }
  else{ document.documentElement.requestFullscreen().catch(() => { fsBtn.hidden = true; }); }
});
document.addEventListener("fullscreenchange", () => {
  fsBtn.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen";
});

/* QR code */
const qrDlg = $("qrDlg"), qrCopy = $("qrCopy");
$("qrBtn").addEventListener("click", () => { qrDlg.showModal(); $("qrClose").focus(); });
$("qrClose").addEventListener("click", () => qrDlg.close());
qrDlg.addEventListener("click", e => { if(e.target === qrDlg) qrDlg.close(); });
qrCopy.addEventListener("click", () => {
  const text = $("qrUrl").textContent.trim();
  const done = ok => { qrCopy.textContent = ok ? "Copied" : "Link selected"; setTimeout(() => { qrCopy.textContent = "Copy link"; }, 2000); };
  const selectIt = () => { const r = document.createRange(); r.selectNodeContents($("qrUrl")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); done(false); };
  try{ navigator.clipboard.writeText(text).then(() => done(true), selectIt); }catch(e){ selectIt(); }
});

applyScale();
renderDeck();
</script>
</body>
